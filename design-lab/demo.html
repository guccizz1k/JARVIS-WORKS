<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>J TEAM · Verified Design Lab</title>
<link rel="stylesheet" href="./design.css"/>
</head><body class="jw-lab">
<main class="jw-shell"><p class="jw-eyebrow">J TEAM · UI/UX SYSTEM</p>
<h1 class="jw-heading">검증 가능한 디자인. 안전한 인터랙션.</h1>
<p>실서비스 코드와 분리된 정적 디자인 시스템 검증 환경입니다.</p>
<section class="jw-grid" aria-label="재사용 가능한 컴포넌트">
<article class="jw-card" data-motion-card><h2>업무 자동화</h2><p>작업 상태를 한눈에 확인합니다.</p><button class="jw-action" type="button">자세히 보기</button></article>
<article class="jw-card" data-motion-card><h2>기업 메신저</h2><p>거래처 협업에 집중하도록 설계합니다.</p><button class="jw-action" type="button">기능 확인</button></article>
<article class="jw-card" data-motion-card><h2>검증 하네스</h2><p>변경 사항은 독립 검증 후 적용합니다.</p><button class="jw-action" type="button">검증 보기</button></article>
</section><p class="jw-status" data-demo-status role="status" aria-live="polite">디자인 시스템 초기화 중</p>
</main>
<script type="module" src="./dist/motion.bundle.js"></script></body></html>
