<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>JARVIS WORKS · 기업 메신저 V9.0 개발용</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#122a33;background:#f4f7f9;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:1280px;margin:26px auto;padding:0 24px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:20px}.brand{font-size:19px;font-weight:800;letter-spacing:-.03em}.brand small{display:block;font-size:12px;color:#778992;font-weight:500;letter-spacing:0;margin-top:4px}.label{font-size:12px;background:#eaf3f6;color:#276e7c;border-radius:20px;padding:7px 12px}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:640px;height:min(760px,calc(100dvh - 138px));border:1px solid #e2e9ec;border-radius:18px;background:white;box-shadow:0 14px 44px #1135490c;overflow:hidden}.directory{border-right:1px solid #e4edf0;display:flex;flex-direction:column;min-height:0}.dirhead{padding:24px 22px 16px;border-bottom:1px solid #eef2f3}.dirhead h1{margin:0 0 5px;font-size:18px}.sub{font-size:12px;color:#778991;margin:0 0 18px}.search{display:block;width:100%;border:1px solid #d8e3e7;border-radius:10px;padding:13px 14px;outline:none}.search:focus,.message-input:focus{border-color:#2e8991;box-shadow:0 0 0 3px #2e89911b}.company-list{overflow:auto;flex:1;padding:12px}.company{display:flex;align-items:center;gap:12px;background:white;border:0;border-radius:12px;width:100%;text-align:left;padding:13px}.company:hover,.company[aria-selected=true]{background:#eaf6f6}.avatar{display:grid;place-items:center;width:42px;height:42px;background:#d9eeee;border-radius:13px;color:#216b6d;font-weight:800;flex:none}.company strong{display:block;font-size:14px}.company span{display:block;color:#788992;font-size:11px;margin-top:4px}.empty-list{padding:18px;color:#7c8c95;font-size:13px}.more{margin:6px 16px 16px;border:1px solid #d9e2e6;border-radius:10px;background:white;padding:10px;color:#426472}.chat{display:flex;flex-direction:column;min-width:0;min-height:0}.chathead{padding:18px 24px;min-height:86px;border-bottom:1px solid #e8edef;display:flex;align-items:center;justify-content:space-between}.chathead h2{font-size:17px;margin:0 0 5px}.meta{font-size:12px;color:#8a999e}.status{font-size:12px;color:#677c83}.status.live{color:#117568}.messages{flex:1;min-height:0;overflow:auto;padding:28px 24px;background:linear-gradient(180deg,#fcfefe,#f7fbfc);display:flex;flex-direction:column;gap:12px}.placeholder{margin:auto;text-align:center;color:#8799a1;font-size:14px;max-width:300px;line-height:1.8}.bubble{max-width:min(80%,470px);align-self:flex-start;background:white;border:1px solid #dfe9ec;border-radius:14px 14px 14px 4px;padding:12px 15px;box-shadow:0 2px 6px #123a4808;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#dff2ef;border-color:#c9e5dd;border-radius:14px 14px 4px 14px}.who{font-weight:700;font-size:11px;color:#4d6b73;margin-bottom:5px}.bodytext{white-space:pre-wrap;line-height:1.55;font-size:14px}.bubble footer{font-size:11px;color:#789199;display:flex;align-items:center;gap:8px;margin-top:8px}.bubble footer button{font-size:11px;color:#2b7c81;border:0;background:none;padding:0}.attachment{display:block;margin-top:9px;color:#136e73;font-size:12px;font-weight:650}.composer{border-top:1px solid #e8edef;padding:16px 20px;background:white}.compose-row{display:flex;align-items:end;gap:10px}.message-input{display:block;min-height:48px;max-height:136px;resize:vertical;flex:1;padding:13px 14px;border:1px solid #d9e3e6;border-radius:11px;outline:0}.primary{border:0;background:#197d80;color:white;border-radius:11px;padding:14px 21px;font-weight:700}.attach-btn{border:1px solid #dce5e8;background:white;color:#45676e;border-radius:11px;padding:12px 15px}.file-info{font-size:12px;color:#566f79;margin:8px 0;min-height:15px}.notice{min-height:16px;margin:9px 0 0;font-size:12px;color:#b94f42}.visually-hidden{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden}a:focus-visible,button:focus-visible{outline:3px solid #7daec4;outline-offset:2px}@media(max-width:730px){.shell{padding:0;margin:0}.top{padding:16px;margin:0}.layout{height:calc(100dvh - 71px);min-height:460px;border-radius:0;grid-template-columns:38% minmax(0,62%)}.dirhead{padding:15px 10px}.dirhead h1{font-size:15px}.company{padding:9px 4px}.avatar{height:34px;width:34px}.messages{padding:14px}.chathead{padding:12px;min-height:75px}.composer{padding:10px}.primary{padding:12px}.attach-btn{padding:10px}.sub{font-size:11px}.search{padding:9px}.company strong{font-size:12px}}
</style>
</head>
<body>
<main class="shell">
 <header class="top"><div class="brand">JARVIS WORKS <small>기업 전용 안전한 업무 대화 · V9.0 검토 화면</small></div><span class="label">STAGING · 출시 전 검증용</span></header>
 <div class="layout">
  <aside class="directory"><div class="dirhead"><h1>기업 찾기</h1><p class="sub">가입·인증된 기업끼리 승인 없이 대화할 수 있습니다.</p><label for="search" class="visually-hidden">기업명 또는 사업자번호 검색</label><input id="search" class="search" placeholder="기업명·사업자번호 검색" maxlength="80" autocomplete="off"></div><div id="companies" role="listbox" aria-label="기업 검색 결과" class="company-list"></div><button id="more" class="more" hidden>기업 더 보기</button></aside>
  <section class="chat" aria-label="기업 메신저"><header class="chathead"><div><h2 id="chatTitle">대화를 시작해 보세요</h2><span class="meta" id="chatMeta">왼쪽에서 인증된 기업을 선택하세요.</span></div><span class="status" id="status" aria-live="polite">연결 대기</span></header><div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions"><div id="blank" class="placeholder">기업을 검색하고 클릭하면 별도 승인 없이 대화가 시작됩니다.</div></div><div class="composer"><div id="fileInfo" class="file-info" aria-live="polite"></div><div class="compose-row"><label class="attach-btn" for="fileInput" role="button" tabindex="0">＋ 파일</label><input type="file" id="fileInput" hidden accept="image/jpeg,image/png,image/webp,image/gif,.pdf,.txt,.docx,.xlsx"><label for="message" class="visually-hidden">메시지 내용</label><textarea id="message" class="message-input" rows="1" maxlength="5000" placeholder="메시지를 입력하세요" disabled></textarea><button id="send" class="primary" disabled>전송</button></div><p class="notice" id="notice" role="alert"></p></div></section>
 </div>
</main>
<script>
(() => {
 'use strict';
 const API='/api/pg-stage/v90';
 const el=id=>document.getElementById(id);
 const st={orgId:'',csrf:'',chat:'',cursor:0,editAt:'1970-01-01T00:00:00+00:00',editId:'',socket:null,nonce:0,attempt:0,selected:null,companies:[],offset:0,hasMore:false,file:null,pending:null,sending:null,messages:new Map(),pendingEdits:new Map()};
 const msg=txt=>{el('notice').textContent=txt||''};
 const connected=(label,live=false)=>{el('status').textContent=label;el('status').classList.toggle('live',live)};
 const request=async(path,options={})=>{
  const headers={'Accept':'application/json',...(options.body?{'Content-Type':'application/json'}:{}),...options.headers};
  if(options.method && options.method!=='GET')headers['X-CSRF-Token']=st.csrf;
  const response=await fetch(path,{...options,headers,credentials:'same-origin',cache:'no-store'});
  if(!response.ok)throw Error('요청 오류 ('+response.status+'). 로그인 또는 접근 권한을 확인하세요.');
  return response.json();
 };
 const readfile=f=>new Promise((resolve,reject)=>{
  const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(Error('파일을 읽지 못했습니다.'));reader.readAsDataURL(f);
 });
 const safeAppend=(parent,tag,text,cls)=>{const node=document.createElement(tag);if(cls)node.className=cls;node.textContent=String(text??'');parent.appendChild(node);return node};
 const nodeFor=(item)=>{
  const node=document.createElement('article');node.className='bubble'+(item.sender_org===st.orgId?' mine':'');node.dataset.messageId=item.message_id;
  safeAppend(node,'div',item.sender_org===st.orgId?'우리 회사':'상대 기업','who');
  safeAppend(node,'div',item.body,'bodytext');
  if(item.filename){const link=safeAppend(node,'a','첨부 · '+item.filename,'attachment');link.href=API+'/chats/'+encodeURIComponent(st.chat)+'/attachments/'+encodeURIComponent(item.message_id);link.download=item.filename;link.rel='noopener';}
  const footer=document.createElement('footer');safeAppend(footer,'span','순번 '+item.message_cursor+(item.version>1?' · 수정됨':''));
  if(item.sender_org===st.orgId && !item.filename && item.version && item.created_at && Date.now()-Date.parse(item.created_at)<30*60*1000){const edit=safeAppend(footer,'button','수정');edit.type='button';edit.onclick=()=>editMessage(item);}
  node.appendChild(footer);return node;
 };
 const render=(item)=>{
  if(!item.message_id)return;
  const old=st.messages.get(item.message_id);
  const oldVersion=Number(old?.version||1),incomingVersion=Number(item.version||1);
  // Delayed HTTP snapshots must never revert a newer WS edit.
  if(old && oldVersion>=incomingVersion)return;
  const queued=st.pendingEdits.get(item.message_id);
  if(queued){
   if(Number(queued.version)>incomingVersion)item={...item,body:queued.new_body,version:queued.version};
   st.pendingEdits.delete(item.message_id);
  }
  st.messages.set(item.message_id,item);
  const previous=Array.from(el('messages').children).find(n=>n.dataset.messageId===item.message_id);
  const node=nodeFor(item);if(previous)previous.replaceWith(node);else el('messages').appendChild(node);
  el('blank')?.remove();el('messages').scrollTop=el('messages').scrollHeight;
 };
 const applyEdit=item=>{
  const old=st.messages.get(item.message_id);
  if(old){
   if(Number(item.version)>Number(old.version||1))render({...old,body:item.new_body,version:item.version});
   return;
  }
  // An edit can arrive before its base message in separate polling queries.
  // Queue only the highest version until that base message is received.
  const prior=st.pendingEdits.get(item.message_id);
  if(!prior||Number(item.version)>Number(prior.version)){
   st.pendingEdits.set(item.message_id,item);
   if(st.pendingEdits.size>500)st.pendingEdits.delete(st.pendingEdits.keys().next().value);
  }
 };
 const markRead=async()=>{if(!st.chat||!st.cursor)return;try{await request(API+'/chats/'+encodeURIComponent(st.chat)+'/read',{method:'POST',body:JSON.stringify({cursor:st.cursor})});}catch{ /* reconnect sync independently repeats read */ }};
 const sync=async(nonce)=>{
   let next=0,rows=[];
   do{
    rows=await request(API+'/chats/'+encodeURIComponent(st.chat)+'/messages?after='+next+'&limit=100');
    if(nonce!==st.nonce)return;
    for(const row of rows){render(row);next=Math.max(next,row.message_cursor);st.cursor=Math.max(st.cursor,row.message_cursor);}
   }while(rows.length===100);
   // Fetch complete edit history separately; last-edit cursor is persisted for WS reconnect.
   let lastAt='1970-01-01T00:00:00+00:00',lastId='',changes=[];
   do{
    const params=new URLSearchParams({after_at:lastAt,after_id:lastId,limit:'100'});
    changes=await request(API+'/chats/'+encodeURIComponent(st.chat)+'/edits?'+params);
    if(nonce!==st.nonce)return;
    for(const e of changes){applyEdit(e);lastAt=e.edited_at;lastId=e.edit_id;}
   }while(changes.length===100);
   st.editAt=lastAt;st.editId=lastId;
   await markRead();
 };
 const join=()=>{
   if(!st.chat)return;
   const local=st.nonce;
   const base=(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+API+'/chats/'+encodeURIComponent(st.chat)+'/stream';
   const qs=new URLSearchParams({after:String(st.cursor),edit_after_at:st.editAt,edit_after_id:st.editId});
   const sock=new WebSocket(base+'?'+qs);st.socket=sock;connected('연결 중');
   sock.onopen=()=>{if(local!==st.nonce||st.socket!==sock){sock.close();return;}connected('실시간 연결',true)};
   sock.onmessage=event=>{if(local!==st.nonce||st.socket!==sock)return;let e;try{e=JSON.parse(event.data)}catch{return}
      if(e.type==='heartbeat'){st.attempt=0;return;}
      if(e.type==='message'){render(e.data);st.cursor=Math.max(st.cursor,e.data.message_cursor);void markRead()}
      if(e.type==='edit'){const next=Date.parse(e.data.edited_at),prev=Date.parse(st.editAt);const id=String(e.data.edit_id||'');if(!Number.isFinite(next)||!id||next<prev||(next===prev&&id<=st.editId))return;applyEdit(e.data);st.editAt=e.data.edited_at;st.editId=id}
   };
   sock.onclose=event=>{if(local!==st.nonce||st.socket!==sock)return;if(event.code===1008){connected('접근 차단');msg('로그인이 만료되었거나 대화 접근 권한이 없습니다. 다시 로그인하세요.');return;}if(st.attempt>=6){connected('연결 중단');msg('연결을 여러 번 시도했으나 실패했습니다. 기업을 다시 선택하면 재시도합니다.');return;}connected('재연결 중');const wait=Math.min(8000,500*Math.pow(2,Math.min(st.attempt++,4)));setTimeout(()=>{if(local===st.nonce&&st.socket===sock)join()},wait)};
   sock.onerror=()=>{if(local===st.nonce&&st.socket===sock)msg('일시적인 연결 오류가 발생했습니다. 자동 재연결합니다.')};
 };
 const selectCompany=async(item)=>{
   st.nonce++;const nonce=st.nonce;st.attempt=0;st.sending=null;el('message').disabled=true;el('send').disabled=true;st.socket?.close();st.chat='';st.cursor=0;st.editAt='1970-01-01T00:00:00+00:00';st.editId='';st.messages.clear();st.pendingEdits.clear();st.selected=item;st.file=null;st.pending=null;el('fileInput').value='';el('fileInfo').textContent='';el('messages').replaceChildren();connected('연결 중');msg('');el('chatTitle').textContent=item.company_name;el('chatMeta').textContent='별도 승인 없이 바로 대화합니다';
   try{const result=await request(API+'/chats',{method:'POST',body:JSON.stringify({other_org_id:item.org_id})});if(nonce!==st.nonce)return;
    st.chat=result.connection_id;el('message').disabled=false;el('send').disabled=false;
    await sync(nonce);if(nonce===st.nonce)join();
   }catch(err){if(nonce===st.nonce){connected('연결 실패');msg(err.message)}};
   drawCompanies();
 };
 const drawCompanies=()=>{
    const list=el('companies');list.replaceChildren();
    if(!st.companies.length)safeAppend(list,'p','검색 결과가 없습니다.','empty-list');
    for(const item of st.companies){const b=document.createElement('button');b.type='button';b.className='company';b.setAttribute('role','option');b.setAttribute('aria-selected',String(st.selected?.org_id===item.org_id));safeAppend(b,'div',item.company_name.slice(0,1),'avatar');const names=document.createElement('div');safeAppend(names,'strong',item.company_name);safeAppend(names,'span','인증된 기업 · 클릭 시 바로 대화');b.appendChild(names);b.onclick=()=>selectCompany(item);list.appendChild(b)}
    el('more').hidden=!st.hasMore;
 };
 let searchVersion=0;
 const search=async(reset=true)=>{
   if(reset){st.offset=0;st.companies=[];}
   const version=++searchVersion;const query=el('search').value.trim();
   const params=new URLSearchParams({q:query,limit:'30',offset:String(st.offset)});
   try{const rows=await request(API+'/companies?'+params);if(version!==searchVersion)return;
    st.companies.push(...rows);st.offset+=rows.length;st.hasMore=rows.length===30;drawCompanies();msg('');
   }catch(err){if(version===searchVersion)msg(err.message)};
 };
 const editMessage=async(item)=>{
   const input=prompt('수정할 메시지',item.body);if(input===null||!input.trim()||input===item.body)return;
   try{await request(API+'/messages/'+encodeURIComponent(item.message_id),{method:'PATCH',body:JSON.stringify({body:input,expected_version:item.version})});msg('수정 요청이 저장됐습니다.');}catch(err){msg(err.message)}
 };
 const send=async()=>{
   // A disabled button is not a concurrency guard: Enter can trigger this handler.
   if(!st.chat||st.sending)return;
   const chat=st.chat,nonce=st.nonce,text=el('message').value,file=st.file;
   if(!text.trim()&&!file&&!st.pending)return;
   const ticket={nonce,chat};st.sending=ticket;
   el('send').disabled=true;msg('');
   try{
    // randomUUID is HTTPS-only in some browsers. For isolated HTTP preview,
    // use the equally CSPRNG-backed getRandomValues without weakening IDs.
    const key=st.pending?.key||(()=>{
      if(typeof crypto.randomUUID==='function')return crypto.randomUUID();
      const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);
      bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;
      const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
      return [hex.slice(0,8),hex.slice(8,12),hex.slice(12,16),hex.slice(16,20),hex.slice(20)].join('-');
    })();
    const payload=st.pending?.payload||{request_id:key,body:text};
    if(file&&!st.pending){payload.filename=file.name;payload.mime=file.type;payload.data_base64=await readfile(file)}
    if(nonce!==st.nonce||chat!==st.chat)return;
    st.pending={key,payload};
    await request(API+'/chats/'+encodeURIComponent(chat)+'/messages',{method:'POST',body:JSON.stringify(payload)});
    if(nonce!==st.nonce||chat!==st.chat)return;
    // Do not erase an edited draft or a newly selected file while a request was in-flight.
    if(st.pending?.key===key)st.pending=null;
    if(el('message').value===payload.body)el('message').value='';
    if(st.file===file){el('fileInput').value='';st.file=null;el('fileInfo').textContent='';}
    if(!st.socket||st.socket.readyState!==WebSocket.OPEN)await sync(nonce);
   }catch(err){if(nonce===st.nonce)msg(err.message+' · 다시 전송하면 동일 요청번호를 사용합니다.');}
   finally{if(st.sending===ticket){st.sending=null;if(nonce===st.nonce)el('send').disabled=false}}
 };
 const allowed=new Set(['image/jpeg','image/png','image/webp','image/gif','application/pdf','text/plain','application/vnd.openxmlformats-officedocument.wordprocessingml.document','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet']);
 el('fileInput').onchange=()=>{const file=el('fileInput').files?.[0];if(!file)return;
    if(file.size===0||file.size>5242880||!allowed.has(file.type)){el('fileInput').value='';st.file=null;msg('첨부파일은 지정된 형식, 5MB 이하만 허용됩니다.');return}
    st.file=file;st.pending=null;el('fileInfo').textContent='첨부: '+file.name+' ('+Math.ceil(file.size/1024)+'KB)';msg('');
 };
 el('send').onclick=send;
 el('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();void send()}};
 let timer;el('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>void search(),260)};
 el('more').onclick=()=>void search(false);
 el('fileInput').addEventListener('change',()=>{st.pending=null});
 (async()=>{try{const me=await request('/api/me');st.orgId=me.org_id;st.csrf=me.csrf_token;await search()}catch(err){msg('로그인 세션을 확인할 수 없습니다. '+err.message)}})();
})();
</script>
</body>
</html>
