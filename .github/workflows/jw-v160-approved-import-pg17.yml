name: JW V16.0 actual PG17 approved import to quote draft integration
on:
  push:
    branches:
      - review/v160-approved-import-to-pg-quote-20261031
permissions:
  contents: read
concurrency:
  group: jw-v160-reviewed-import
  cancel-in-progress: true
jobs:
  real-pg17-human-approved-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 4s
          --health-timeout 3s
          --health-retries 12
    env:
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-only-ephemeral-test-password@127.0.0.1:5432/postgres
      JW_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check production paths preserved
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:app/main.py)" = "0ede250ddbcf98b19f7747c8781ca4c8aa95e738"
          git diff --exit-code cc176121bd31913235e51ebf4effbf0e04fcda58 HEAD -- app/main.py app/static/ security/ migrations/ requirements.txt
      - name: Install isolated test dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-pg-stage.txt
          python -m pip install 'fastapi==0.128.2' 'starlette==0.50.0' 'anyio==4.13.0' 'httpx==0.28.1'
      - name: Static module compilation
        run: python -m compileall -q app scripts
      - name: PG17 signed-in confirmed document to draft quote real HTTP
        run: python -m scripts.ci_v160_approved_import_pg
