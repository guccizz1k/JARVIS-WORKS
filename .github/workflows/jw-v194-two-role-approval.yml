name: JW V19.4 isolated separate reviewer role - real TLS PG17
on:
  push:
    branches:
      - review/v194-separate-import-approver-20261101
permissions:
  contents: read
concurrency:
  group: jw-v194-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reviewer-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JW_ENV: review
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-only-ephemeral-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned existing API / PostgreSQL test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt
      - name: Gate isolated SQL role boundaries and test source
        run: |
          python -m py_compile scripts/ci_v194_separate_reviewer_https.py scripts/review/pg_import_preview_v194.py
          python - <<'PY'
          from pathlib import Path
          r=Path("scripts/ci_v194_separate_reviewer_https.py").read_text()
          s=Path("scripts/review/v194_disposable_separate_reviewer.sql").read_text()
          t=Path("scripts/review/pg_import_preview_v194.py").read_text()
          for token in ("fixture.disposable_root_check()","ONLY_EPHEMERAL_LOCAL_DATABASE",
             "verify=str(cert)","trust_env=False","PASS_V194_20_DIRECT_DB",
             "make_conninfo","has_column_privilege"):
            assert token in r,token
          for token in ("REVOKE UPDATE(status)","DROP POLICY v193_review_owner_confirm",
             "FOR UPDATE TO jw_ci_v194_approver","status='pending'",
             "status='confirmed'","preview_digest"):
            if token == "preview_digest":
               assert token in t,token
            else:assert token in s,token
          assert "TestClient(" not in r
          assert not any(n in s+t for n in ("JW_PG_STAGE_DSN","SUPABASE_SERVICE_KEY"))
          print("PASS_V194_STATIC_TWO_CREDENTIAL_ISOLATED_GUARD",flush=True)
          PY
      - name: Real verified TLS and 20 direct-role approval bypass tests
        run: python -m scripts.ci_v194_separate_reviewer_https
