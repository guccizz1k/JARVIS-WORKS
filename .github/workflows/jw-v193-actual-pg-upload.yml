name: JW V19.3 true XLSX upload PG17 restricted HTTPS (review only)
on:
  push:
    branches:
      - review/v193-actual-upload-confirm-pg17-20261101
permissions:
  contents: read
concurrency:
  group: jw-v193-upload-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-upload-confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JW_ENV: review
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-only-ephemeral-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checked-in app and PostgreSQL testing requirements
        run: python -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt
      - name: Compile and verify disposable-only source
        run: |
          python -m py_compile scripts/ci_v193_actual_upload_pg17_https.py scripts/review/pg_import_preview_v193.py
          python - <<'PY'
          from pathlib import Path
          a=Path('scripts/ci_v193_actual_upload_pg17_https.py').read_text()
          b=Path('scripts/review/pg_import_preview_v193.py').read_text()
          c=Path('scripts/review/v193_disposable_import_write_policies.sql').read_text()
          for needle in ('disposable_root_check','ONLY_EPHEMERAL_LOCAL_DATABASE',
                         'verify=str(cert)','trust_env=False','20_FAKE_CONFIRM_IDS',
                         '12_REAL_TLS_CONCURRENT'):
            assert needle in (a+b),needle
          for needle in ('FORCE ROW LEVEL SECURITY','REVOKE ','DROP TABLE','GRANT UPDATE (status)','WITH CHECK'):
            if needle in ('FORCE ROW LEVEL SECURITY','REVOKE ','DROP TABLE'):
              assert needle not in c
            else:assert needle in c
          assert 'TestClient(' not in a
          print('PASS_V193_DISPOSABLE_SOURCE_GUARD')
          PY
      - name: Actual signed TLS XLSX preview and human confirmation to internal order
        run: python -m scripts.ci_v193_actual_upload_pg17_https
