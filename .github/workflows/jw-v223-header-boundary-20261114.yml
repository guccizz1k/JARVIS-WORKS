name: JW V22.3 A isolated header and CSRF regression
on:
  push:
    branches:
      - review/jw-v223-a-isolate-headers-20261114
    paths:
      - app/pg_cinema_cutover_front_v223.py
      - tests/test_cinema_pg_cutover_merged_header_boundary_v223.py
      - tests/test_cinema_pg_v223_direct_route_header_isolation.py
      - tests/test_cinema_pg_cutover_front_v223.py
      - tests/test_cinema_pg_cutover_logout_v223.py
      - .github/workflows/jw-v223-header-boundary-20261114.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jw-v223-safe-header-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-header-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal unit test dependencies only
        run: |
          python -m pip install --disable-pip-version-check 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'pytest>=8,<10' 'pytest-asyncio>=0.24,<2'
      - name: Compile protected-scope A code and isolated tests
        run: |
          python -m py_compile app/pg_cinema_cutover_front_v223.py tests/test_cinema_pg_cutover_merged_header_boundary_v223.py tests/test_cinema_pg_v223_direct_route_header_isolation.py tests/test_cinema_pg_cutover_front_v223.py tests/test_cinema_pg_cutover_logout_v223.py
      - name: Run synthetic ASGI credential boundary tests; no real network/DB/keys
        run: |
          python -m pytest -q -ra -p no:cacheprovider --noconftest --junitxml=header-unit.xml tests/test_cinema_pg_cutover_merged_header_boundary_v223.py tests/test_cinema_pg_v223_direct_route_header_isolation.py tests/test_cinema_pg_cutover_front_v223.py tests/test_cinema_pg_cutover_logout_v223.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('header-unit.xml').getroot()
          suites=[root] if root.tag=='testsuite' else root.findall('.//testsuite')
          values={k:sum(int(s.get(k,'0')) for s in suites) for k in ('tests','failures','errors','skipped')}
          assert values=={'tests':32,'failures':0,'errors':0,'skipped':0}, values
          print('A_TRACK_HEADER_AND_SESSION_32_OF_32_PASS')
          PY
