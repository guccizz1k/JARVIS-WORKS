name: JW CINEMA PG17 candidate gate - S4 ledger claims and P2 login role (disposable DB only)
on:
  push:
    branches:
      - review/jw-cinema-pg-engine-20261104
    paths:
      - scripts/review/cinema_pg_s4_dev_migration.sql
      - scripts/review/cinema_pg_s4_dev_rollback.sql
      - scripts/review/cinema_pg_p2_login_role.sql
      - scripts/review/cinema_pg_p2_login_role_rollback.sql
      - scripts/ci_cinema_pg_p1_p2_pg17_suite.py
      - .github/workflows/jw-cinema-pg-p1-p2-pg17.yml
      # everything the suite loads at run time (a change there must re-run the PG17 candidate gate too)
      - scripts/ci_cinema_pg_sql_gate.py
      - scripts/review/cinema_pg_write_engine.sql
      - db/review/ci_v90_ephemeral_pg_schema.sql
      - db/review/ci_qa_001_jw_dev_secure_messenger_directory.sql
      - db/review/ci_qa_002_jw_dev_messenger_rpc.sql
      - db/review/ci_qa_006_commit_order_cursor_guard_candidate.sql
      - db/review/ci_v92_quote_ephemeral.sql
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jw-cinema-pg-p1-p2-pg17
  cancel-in-progress: true
jobs:
  p1-p2-candidate-pg17:
    name: "S4 + P2 candidates on a throw-away PostgreSQL 17 (never touches Supabase or production)"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          # Throw-away service container reachable only from this runner; no password exists anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:5432:5432   # loopback only; never published on the runner's external interface
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JW_CINEMA_PG_DISPOSABLE: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Containment guard (unchanged; protected hashes, whitelist, no deleted tests, no new skips)
        run: python3 -I scripts/ci_cinema_pg_guard.py
      - name: Assert no production, Supabase, Render or password settings exist in this job (names only; values are never printed)
        run: |
          set -euo pipefail
          if env | cut -d= -f1 | grep -E '^(SUPABASE_|DATABASE_URL$|POSTGRES_URL|POSTGRES_PRISMA_URL|RENDER_|PGPASSWORD$|PGSERVICE$|PGPASSFILE$)'; then
            echo "forbidden connection setting present in the job environment" >&2; exit 1
          fi
          test "$PGHOST" = "127.0.0.1"
          echo "environment clean; target is the loopback service container only"
      - name: Assert the service port is not published on an external interface
        run: |
          set -euo pipefail
          ss -ltnH 'sport = :5432' | tee port-listeners.txt
          if grep -E '(^|[[:space:]])(0\.0\.0\.0|\*|\[::\]):5432' port-listeners.txt; then
            echo "PostgreSQL port 5432 is listening on a non-loopback interface" >&2; exit 1
          fi
      - name: Record exact server version (must be PostgreSQL 17.x) and candidate hashes
        run: |
          set -euo pipefail
          psql -X -A -t -c "show server_version" | tee pg-version.txt
          v="$(psql -X -A -t -c "show server_version_num")"
          test "$v" -ge 170000 && test "$v" -lt 180000 || { echo "server_version_num=$v is not PostgreSQL 17" >&2; exit 1; }
          sha256sum scripts/review/cinema_pg_s4_dev_migration.sql scripts/review/cinema_pg_s4_dev_rollback.sql \
            scripts/review/cinema_pg_p2_login_role.sql scripts/review/cinema_pg_p2_login_role_rollback.sql \
            scripts/ci_cinema_pg_p1_p2_pg17_suite.py | tee candidate-sha256.txt
          git rev-parse HEAD | tee head-sha.txt
      - name: S4 + P2 candidate suite on PostgreSQL 17 (creates and drops its own database; exit 1 on any failure)
        run: |
          set -euo pipefail
          python3 -I scripts/ci_cinema_pg_p1_p2_pg17_suite.py --report jw-cinema-pg-p1-p2-pg17.json 2>&1 | tee jw-cinema-pg-p1-p2-pg17.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-cinema-pg-p1-p2-pg17
          path: |
            jw-cinema-pg-p1-p2-pg17.json
            jw-cinema-pg-p1-p2-pg17.log
            pg-version.txt
            candidate-sha256.txt
            port-listeners.txt
            head-sha.txt
          retention-days: 30
