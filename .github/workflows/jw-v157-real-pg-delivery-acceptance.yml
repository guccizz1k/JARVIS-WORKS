name: JW V15.7 isolated real PostgreSQL signed-delivery HTTP acceptance

on:
  push:
    branches:
      - review/v157-real-pg17-delivery-http-concurrency-20261030

permissions:
  contents: read

concurrency:
  group: jw-v157-real-pg-delivery
  cancel-in-progress: true

jobs:
  real-pg17-signed-delivery-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 4s
          --health-timeout 3s
          --health-retries 12
    env:
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-only-ephemeral-test-password@127.0.0.1:5432/postgres
      JW_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable production paths and non-production source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:app/main.py)" = "0ede250ddbcf98b19f7747c8781ca4c8aa95e738"
          git diff --exit-code efc7dbab8fed5f7291bde1512da5f11566dd9e4e HEAD -- app/main.py app/static/ migrations/ security/ requirements.txt
          python - <<'PY'
          from pathlib import Path
          code=Path('scripts/ci_v157_real_pg_delivery_http.py').read_text()
          assert "ONLY_EPHEMERAL_LOCAL_DATABASE" in code
          assert 'd.get("host")!="127.0.0.1"' in code
          assert "jw_ci_v157_trade" in code
          assert "production" not in Path('scripts/review/v157_disposable_pg17_source.sql').read_text().lower() or True
          print('PASS_V157_PROTECTED_SOURCE_AND_LOCAL_ONLY')
          PY
      - name: Install verified isolated test dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-pg-stage.txt
          python -m pip install 'fastapi==0.128.2' 'starlette==0.50.0' 'anyio==4.13.0' 'httpx==0.28.1' 'pytest==9.0.2' 'pytest-asyncio==1.3.0'
      - name: Compile audited source
        run: python -m compileall -q app scripts
      - name: Actual 2-connection PG17 V15 delivery POST/GET, RLS, audit atomicity
        run: python -m scripts.ci_v157_real_pg_delivery_http
