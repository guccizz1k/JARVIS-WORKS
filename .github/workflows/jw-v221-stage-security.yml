name: JW V22.1 real staging v201 RLS catalog and full regression
on:
  push:
    branches:
      - review/v221-staging-v201-rls-proof-20261103
permissions:
  contents: read
concurrency:
  group: jw-v221-stage-catalog
  cancel-in-progress: true
jobs:
  source-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    env:
      JW_ENV: review
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate 1 - source boundary and syntax
        run: |
          set -euo pipefail
          python -m py_compile scripts/jw_v135_stage_connection_probe.py tests/test_jw_v135_stage_connection_probe.py
          python - <<'PY'
          from pathlib import Path
          import subprocess
          base="31546cfef12928e3c588628dab1a84264c042b36"
          changes=set(subprocess.check_output(["git","diff","--name-only",base,"HEAD"],text=True).splitlines())
          expected={"scripts/jw_v135_stage_connection_probe.py","tests/test_jw_v135_stage_connection_probe.py",".github/workflows/jw-v221-stage-security.yml"}
          assert changes==expected,(changes,expected)
          s=Path("scripts/jw_v135_stage_connection_probe.py").read_text()
          assert "(45, 45)" in s and "v201_approval_secrets" in s and "v201_approval_receipts" in s
          assert "rolbypassrls" in s and "NOT" not in ""
          assert "PRODUCTION_BLOCKED" in Path("app/deployment_safety_v78.py").read_text()
          print("PASS_V221_REVIEW_ONLY_SOURCE_BOUNDARY")
          PY
      - name: Install full regression prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
          python -m pip install -r requirements.txt pytest pytest-asyncio httpx 'psycopg[binary]>=3,<4' 'PyMuPDF>=1.25,<2' reportlab
      - name: Preserve exact historical test overlay
        run: |
          python -m scripts.ci_rebuild_v79_overlay
          test -s ../overlay/BASE_SHA256.json
          test -s ../overlay/PAYLOAD_SHA256.json
      - name: Gate 2/3 - stage parser and 20+ negative role/RLS cases
        run: |
          python -m pytest -q -ra -p no:cacheprovider --basetemp=/tmp/jw-v221-focused tests/test_jw_v135_stage_connection_probe.py tests/test_jw_v134_protected_stage.py
      - name: Gate 1/2/3 - entire repository with no skipped tests
        run: |
          mkdir -p artifacts/v221/
          python -m pytest -q -ra -p no:cacheprovider --basetemp=/tmp/jw-v221-full --junitxml=artifacts/v221/pytest.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse("artifacts/v221/pytest.xml").getroot()
          attr=root.attrib if root.tag=="testsuite" else root.find(".//testsuite").attrib
          counts={x:int(attr.get(x,0)) for x in ("tests","failures","errors","skipped")}
          assert counts["tests"]>=1984 and counts["failures"]==0 and counts["errors"]==0 and counts["skipped"]==0,counts
          print("PASS_V221_FULL_REPOSITORY_NO_SKIP",counts)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v221-stage-catalog-full-pytest
          path: artifacts/v221/pytest.xml
          retention-days: 7
          if-no-files-found: ignore
