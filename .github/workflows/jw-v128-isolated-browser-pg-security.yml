name: JW V12.8 isolated browser PG17 and security proof

on:
  push:
    branches:
      - review/private-main-acceptance-20261027
      - review/v128-jteam-private-execution-hardening-20261026
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jw-v128-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    env:
      JW_ENV: review
      JW_INSECURE_LOCAL_DEV: "1"
      DEMO_SEED: "1"
      JW_BROWSER_CI_ONLY: ISOLATED_LOOPBACK_DEMO
      JARVIS_DB_PATH: /tmp/jw-v128-browser.sqlite3
      JTEAM_PAID_API_APPROVED: "NO"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install reviewed browser test prerequisites
        run: |
          python -m pip install -r requirements-dev.txt
          npm install -g @playwright/cli@0.1.22
          playwright-cli install
          node --check app/static/app.js
      - name: Run live Chromium against private loopback synthetic app
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 > /tmp/jteam-v128-browser.log 2>&1 &
          p=$!
          trap 'kill "$p" 2>/dev/null || true' EXIT
          python -m scripts.ci_playwright_cli_smoke
          python -m scripts.ci_playwright_cli_document_e2e
          python -m scripts.ci_playwright_cli_quote_form_e2e
      - name: Save only synthetic UI proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jteam-v128-local-browser
          path: artifacts/playwright-cli/
          if-no-files-found: ignore
          retention-days: 2

  pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JW_ENV: review
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-only-ephemeral-test-password@127.0.0.1:5432/postgres
      JTEAM_PAID_API_APPROVED: "NO"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned temporary PostgreSQL dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt
          npm install -g @playwright/cli@0.1.22
          playwright-cli install
      - name: Postgres 17 isolated messenger concurrency, backup/restore and TLS tests
        run: |
          python -m scripts.ci_v90_postgres_browser
          python -m scripts.ci_j6_postgres_restore
          python -m scripts.ci_pg_v91_tls_gateway

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      JW_ENV: review
      SEMGREP_SEND_METRICS: "off"
      JTEAM_PAID_API_APPROVED: "NO"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static security policy gate (no production network)
        run: |
          python -m pip install 'semgrep==1.182.1'
          python scripts/ci_semgrep_security.py
      - name: Protected role and private source policy checks
        run: |
          python scripts/jw_agent_team_gate.py --root .
          python scripts/jw_skill_contract.py --root .
          python -m scripts.jw_evidence_gate --check-project .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jteam-v128-local-security
          path: artifacts/semgrep/
          if-no-files-found: ignore
          retention-days: 2
