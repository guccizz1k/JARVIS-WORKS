name: JW V18.6 two real Korean receipt OCR measurements (research only)
on:
  push:
    branches:
      - review/v186-public-korean-ocr-pilot-20261031
permissions:
  contents: read
concurrency:
  group: jw-v186-real-ocr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-korean-receipt-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      JW_ENV: review
      JW_V186_OCR_ACK: RESEARCH_ONLY_PUBLIC_KORIE_TWO_SAMPLES
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing offline OCR and HTTPS dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor
      - name: Gate 1 compile and 26 fail-closed tests
        run: |
          python -m py_compile scripts/ci_v186_public_korean_ocr.py
          python -m pytest -q tests/test_v186_public_korean_ocr.py -ra --junitxml=v186-numeric.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          e=ET.parse('v186-numeric.xml').getroot()
          t=list(e.iter('testcase'))
          assert len(t)==26 and not any(x.find(y) is not None for x in t for y in ('failure','error','skipped'))
          print('PASS_V186_26_NUMERIC_AND_PERMISSION_GUARD_CASES')
          PY
      - name: Gates 2-5 actual scanned Korean receipts with image integrity and measured recall
        run: python -m scripts.ci_v186_public_korean_ocr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v186-numeric-junit-no-raw-receipts
          path: v186-numeric.xml
          retention-days: 3
          if-no-files-found: ignore
