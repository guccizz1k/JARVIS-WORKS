name: JW V21.6 independent proof, whole-suite and laptop browser regression
on:
  push:
    branches:
      - review/v216-independent-proof-coverage-20261102
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: jw-v216-independent-review
  cancel-in-progress: true
jobs:
  ui-j3:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JW_ENV: review
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate 1/3 - preserve backend and exact change scope
        run: |
          set -euo pipefail
          python -m py_compile scripts/jw_j3_origin_gate.py scripts/ci_v216_j3_provenance_tests.py scripts/ci_v216_browser_edges.py
          node --check app/static/app.js
          node --check app/static/premium_v214.js
          python - <<'PY'
          from pathlib import Path
          import subprocess
          base="b26b624f41127f0e1ba906a2a5ba5e11c2430cc2"
          got=set(subprocess.check_output(["git","diff","--name-only",base,"HEAD"],text=True).splitlines())
          expected={"app/static/premium_v214.css","scripts/jw_j3_origin_gate.py",
                    "scripts/ci_v216_j3_provenance_tests.py","scripts/ci_v216_browser_edges.py",
                    ".github/workflows/jw-v216-independent-proof.yml"}
          assert got==expected,(got,expected)
          assert "PRODUCTION_BLOCKED" in Path("app/deployment_safety_v78.py").read_text()
          print("PASS: exactly review-only UI, J3 gate and QA files changed; backend untouched")
          PY
      - name: Gate 3 - original J3 adversarial tests
        run: python -m scripts.ci_v215_j3_origin_tests
      - name: Gate 3 - V21.6 J3 origin plus CLI adversarial tests
        run: python -m scripts.ci_v216_j3_provenance_tests
      - name: Gate 3 - real live GitHub CLI provenance verification (not product PASS)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.jw_j3_origin_gate \
            --verify-run "https://github.com/guccizz1k/JARVIS-WORKS/actions/runs/41432122556" \
            --source b26b624f41127f0e1ba906a2a5ba5e11c2430cc2 \
            --baseline 7289aeb7d670dbd41161a371bcfb861c9ddbe1cb \
            --workflow-path .github/workflows/jw-v215-ui-j3-regression.yml
      - name: Install real FastAPI/Chromium tools
        run: |
          python -m pip install -r requirements.txt 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Gate 2/3/4 - V21.4 actual authenticated business regression
        run: python -m scripts.ci_v214_desktop_dark_browser
      - name: Gate 2/4 - V21.5 approved login regression
        run: python -m scripts.ci_v215_login_viewport_browser
      - name: Gate 2/4 - V21.6 laptop window heights, MFA and real login
        run: python -m scripts.ci_v216_browser_edges
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v216-browser-proof
          path: |
            artifacts/v214-desktop/
            artifacts/v215-login/
            artifacts/v216-browser/
          retention-days: 7
          if-no-files-found: ignore
  whole-pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JW_ENV: review
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install full-suite dependencies (review-only)
        run: |
          python -m pip install -r requirements.txt pytest pytest-asyncio httpx 'psycopg[binary]>=3,<4' PyMuPDF
      - name: Gate 1/2/3/5 - run every collected pytest, no omissions
        run: |
          mkdir -p artifacts/v216/
          python -m pytest -q -ra -p no:cacheprovider --basetemp=/tmp/jw-v216-pytest \
            --junitxml=artifacts/v216/pytest-full.xml
      - name: Gate 3 - no skipped/xfailed tests disguised as ALL PASS
        run: |
          python - <<'PY'
          from xml.etree import ElementTree
          root=ElementTree.parse("artifacts/v216/pytest-full.xml").getroot()
          suites=[root] if root.tag=="testsuite" else root.findall(".//testsuite")
          skipped=sum(int(x.get("skipped",0)) for x in suites if x.get("tests") is not None)
          print("Full pytest skipped count:",skipped)
          assert skipped==0,"BLOCKED: skipped tests cannot count as ALL PASS"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v216-full-pytest-evidence
          path: artifacts/v216/pytest-full.xml
          retention-days: 7
          if-no-files-found: ignore
