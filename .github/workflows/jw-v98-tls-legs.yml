name: JW V9.8 isolated read-only Supavisor TLS legs
on:
  push:
    branches:
      - review/v98-supavisor-backend-tls-diagnosis-20261025
permissions:
  contents: read
jobs:
  tls-legs-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      JW_ENV: review
      JW_V97_LIVE_ACK: READ_ONLY_SUPAVISOR_ACCEPTANCE_V97
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing PostgreSQL test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt
      - name: J1–J6 regression on diagnosis confidentiality and rollback
        run: python -m pytest -q tests/test_ci_v98_supavisor_tls_legs.py -ra
      - name: Strictly read-only existing restricted Supavisor sessions
        env:
          JW_V97_TRADE_DSN: ${{ secrets.JW_V97_TRADE_DSN }}
          JW_V97_AUTH_DSN: ${{ secrets.JW_V97_AUTH_DSN }}
        run: |
          python -m scripts.ci_v98_supavisor_tls_legs > v98-redacted-diagnostic.json
          python - <<'PY'
          import json
          result=json.load(open("v98-redacted-diagnostic.json"))
          print("TLS legs diagnostic:",result["result"],
                "components:",result.get("components",{}))
          assert result["authenticated"] is False and result["production_cutover"] is False
          assert result["result"]=="DIAGNOSED"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v98-redacted-tls-legs
          path: v98-redacted-diagnostic.json
          retention-days: 3
          if-no-files-found: ignore

  verified-dual-restricted-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      JW_ENV: review
      JW_V97_LIVE_ACK: READ_ONLY_SUPAVISOR_ACCEPTANCE_V97
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies used by existing regression
        run: python -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt
      - name: J1-J6 regression for direct vs proxy client TLS and tenant boundaries
        run: |
          python -m pytest -q tests/test_ci_v97_supavisor_restricted_auth.py \
            tests/test_ci_v97_independent_boundary.py \
            tests/test_pg_connection_gate_v87.py \
            tests/test_ci_v98_supavisor_tls_legs.py -ra --junitxml=jw-v98-focused.xml
      - name: Actual nonprivileged DB auth, client TLS and read-only RLS catalog
        env:
          JW_V97_TRADE_DSN: ${{ secrets.JW_V97_TRADE_DSN }}
          JW_V97_AUTH_DSN: ${{ secrets.JW_V97_AUTH_DSN }}
        run: |
          python -m scripts.ci_v97_supavisor_restricted_auth --require-authenticated > jw-v98-live-verdict.json
          python - <<'PY'
          import json
          j=json.load(open("jw-v98-live-verdict.json"))
          print("REAL V9.8 Supavisor:",j["decision"],"reason:",j.get("reason","UNKNOWN"))
          if j["decision"]!="PASS":
              raise SystemExit("BLOCKED: full dual-account acceptance not proven")
          b=j.get("independent_boundary",{})
          print("Catalog-only independent acceptance:",b.get("decision"),
                "jw_dev tables:",b.get("jw_dev_tables"),
                "client TLS:",b.get("verified_client_tls"),
                "DB backend TLS:",b.get("backend_tls_active"))
          assert b.get("decision")=="PASS"
          assert b.get("verified_client_tls") is True
          assert j.get("tenant_row_isolation")=="NOT RUN"
          assert j["production_cutover"] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v98-dual-readonly-verdict
          path: |
            jw-v98-live-verdict.json
            jw-v98-focused.xml
          retention-days: 3
          if-no-files-found: ignore
