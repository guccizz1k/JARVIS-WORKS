name: JW V17.1 isolated NTS record adapter — no live API
on:
  push:
    branches:
      - review/v171-nts-registry-fail-closed-20261031
permissions:
  contents: read
concurrency:
  group: jw-v171-registry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  v171-offline-registry-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal reviewed dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: J1-J3 compile + 45 strict offline registry cases
        run: |
          python -m py_compile scripts/review/nts_registry_v171.py
          python -m pytest -q tests/test_v171_official_registry_fail_closed.py -ra --junitxml=v171-registry.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse("v171-registry.xml").getroot()
          x=root if root.tag=="testsuite" else root.find("testsuite")
          assert x is not None and int(x.get("tests","0")) >= 45
          assert all(int(x.get(k,"0"))==0 for k in ("failures","errors","skipped"))
          print("PASS_V171_45_STRICT_OFFLINE_NTS_ATTACKS_NO_REAL_API_CALLS")
          PY
      - name: Preserve strict independent evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v171-registry-junit
          path: v171-registry.xml
          retention-days: 3
          if-no-files-found: ignore
