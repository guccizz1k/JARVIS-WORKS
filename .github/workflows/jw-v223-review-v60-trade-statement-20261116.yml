name: V22.3 review-only automation one-click statement UI exact SHA QA
on:
  push:
    branches: [review/jw-v223-v60-trade-statement-ui-20261116]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  one-click-statement:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact parent and immutable main/owner-UI provenance
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5711acaa9203341dbd190f30efd9ed7009bca4f5 HEAD
          test "$(git hash-object app/main.py)" = 775f500c8a7549d434ce196a8e0763aea33e1c67
          test "$(git hash-object app/static/approved_v223_owner_original.html)" = a1712541b46167c21e9779d41bb198745df2ffc0
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','5711acaa9203341dbd190f30efd9ed7009bca4f5','HEAD'],text=True).splitlines())
          expected={'app/static/approved_ui_server_bridge_v223.js','app/static/approved_ui_server_review_v223.js',
          'tests/test_v223_review_trade_statement_node.cjs','.github/workflows/jw-v223-review-v60-trade-statement-20261116.yml',
          '.github/workflows/jw-v223-approved-review-server-mode-20261115.yml'}
          assert changed==expected,(changed,expected)
          print('PASS_ONLY_REVIEW_UI_NO_CORE_NO_DB_NO_MAIN')
          PY
      - name: Full review Node security regression and new immutable snapshot cases
        run: |
          set -euo pipefail
          node --check app/static/approved_ui_server_bridge_v223.js
          node --check app/static/approved_ui_server_review_v223.js
          node --check tests/test_v223_review_trade_statement_node.cjs
          node --test tests/test_v223_approved_review_node.cjs tests/test_v223_review_operational_panels.cjs tests/test_v223_review_trade_statement_node.cjs
      - name: Scope
        run: echo 'Review-only browser flow; not real production data, no P1 B2/B3 or full P2/P4 release PASS.'
