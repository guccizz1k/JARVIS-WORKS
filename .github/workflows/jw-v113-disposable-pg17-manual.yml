name: JW V11.3 disposable PG17 wake + OCR proof (MANUAL ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jw-v113-disposable-pg17-manual-only
  cancel-in-progress: false
jobs:
  disposable-pg17-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-fixture-only-not-a-real-secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 8
    env:
      JW_ENV: review
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-fixture-only-not-a-real-secret@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies (no OCR/media workers)
        run: python -m pip install "psycopg[binary]>=3.2,<4" "pytest>=8,<10" "pytest-asyncio>=0.24,<2"
      - name: Review V11.2/V11.3 unit contracts
        run: python -m pytest -q tests/test_pg_v112_features.py tests/test_jw_v113_pg_review_guard.py -ra
      - name: Exact local PostgreSQL17 commit/rollback + two-listener + lease tests
        run: python -m scripts.jw_v113_ephemeral_pg_integration
