name: JW V22.3 SQLite-PG cutover front dual-session pilot security
on:
  push:
    branches:
      - candidate/jw-v223-pg-backup-restore-20261106
      - review/jw-v223-two-track-integration-20261107
      - review/jw-v223-track-a-login-revocation-20261107
      - review/jw-v223-ab-cutover-integration-20261107
      - review/jw-v223-ab-final-tree-qa-20261109
      - review/jw-v223-a-route-header-isolation-20261109
      - review/jw-v223-a-cookie-dup-transport-20261109
      - review/jw-v223-a-response-cookie-guard-20261109
      - review/jw-v223-ab-cookie-codespace-qa-20261109
      - review/jw-v223-ab-cookie-attr-ambiguity-20261109
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cutover-front-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protected source boundary guard
        run: |
          set -euo pipefail
          python3 -I scripts/ci_cinema_pg_guard.py
      - name: Install application test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r requirements-dev.txt -r requirements-postgres-check.txt
      - name: Verify compile and fail-closed cutover behavior
        run: |
          set -euo pipefail
          python3 -m py_compile app/pg_cinema_cutover_front_v223.py app/pg_cinema_cutover_ui_v223.py app/cinema_entry_v1.py tests/test_cinema_pg_cutover_front_v223.py tests/test_cinema_pg_cutover_logout_v223.py tests/test_cinema_pg_cutover_ui_v223.py tests/test_cinema_pg_v223_direct_route_header_isolation.py tests/test_cinema_pg_v223_fail_closed_cookie_and_merged_outage.py tests/test_cinema_pg_v223_response_cookie_security.py
          python3 -c 'from app.pg_cinema_cutover_ui_v223 import JS; from pathlib import Path; Path("/tmp/jw-cutover-ui-v223.js").write_text(JS, encoding="utf-8")'
          node --check /tmp/jw-cutover-ui-v223.js
          python3 -m scripts.ci_cinema_pg_cutover_ui_node_v223 | tee cutover-ui-node.log
          grep -F 'PASS_V223_CINEMA_DUAL_UI_NODE checks=24 failures=0 synthetic_only=true' cutover-ui-node.log
          python3 -m pytest -q -rA tests/test_cinema_pg_cutover_front_v223.py tests/test_cinema_pg_cutover_logout_v223.py tests/test_cinema_pg_cutover_ui_v223.py | tee cutover-front.log
          grep -E '31 passed' cutover-front.log
          echo 'DISPOSABLE TEST STUBS ONLY: SQLite real users, PG real sessions, UI and public HTTPS cutover NOT verified.'
