name: JW V17.3 guarded DEV FK index regression
on:
  push:
    branches:
      - review/v173-dev-review-index-fk-20261031
permissions:
  contents: read
concurrency:
  group: jw-v173-index-${{ github.ref }}
  cancel-in-progress: true
jobs:
  v173-dev-index-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing isolated dev requirements
        run: python -m pip install -r requirements-dev.txt
      - name: J1 J3 J5 29 strict index integrity and corruption tests
        run: |
          python -m pytest -q tests/test_v173_dev_fk_indexes.py -ra --junitxml=v173-index.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('v173-index.xml').getroot()
          suite=root if root.tag=='testsuite' else root.find('testsuite')
          assert suite is not None and int(suite.get('tests','0')) == 29
          assert all(int(suite.get(k,'0'))==0 for k in ('failures','errors','skipped'))
          print('PASS_V173_29_INDEX_GUARD_CASES')
          PY
      - name: Upload independent proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jw-v173-guard-junit
          path: v173-index.xml
          retention-days: 3
          if-no-files-found: ignore
