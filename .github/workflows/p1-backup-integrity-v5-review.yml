name: P1 backup integrity V5 review

on:
  # Avoid charging for duplicate push + PR jobs for the same review SHA.
  # Manual isolated branch validation remains available via workflow_dispatch.
  pull_request:
    branches:
      - main
      - review/jw-v223-render-qa-pinned-20261122
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jw-p1-v5-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-unit:
    name: P1 V5 isolated regression (no database)
    if: github.repository == 'guccizz1k/JARVIS-WORKS'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout review commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact reviewed source SHA
        env:
          JW_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$JW_EXPECTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10' 'cryptography>=43,<47'
      - name: Compile engine and test
        run: python -m py_compile scripts/pg_backup_v223.py tests/test_p1_backup_integrity_v5.py scripts/p1_owner_one_shot_v223.py tests/test_p1_owner_one_shot_v223.py scripts/p1_owner_archive_inventory_v223.py tests/test_p1_owner_archive_inventory_v223.py scripts/p1_owner_archive_deep_v223.py tests/test_p1_owner_archive_deep_v223.py tests/test_p1_constraint_deparser_v5.py tests/test_p1_owner_offline_restore_v223.py scripts/p1_owner_vault_readback_v223.py tests/test_p1_owner_vault_readback_v223.py scripts/p1_owner_vault_upload_v223.py tests/test_p1_owner_vault_upload_v223.py scripts/p1_owner_remote_recovery_v223.py tests/test_p1_owner_remote_recovery_v223.py scripts/p1_cleanroom_key_recovery_v223.py tests/test_p1_cleanroom_key_recovery_v223.py scripts/p1_external_custodian_pg17_v223.py scripts/p1_external_worm_compliance_v223.py scripts/p1_owner_vault_scope_pin_v223.py tests/test_p1_owner_vault_scope_pin_v223.py scripts/p1_backblaze_b2_readonly_v223.py tests/test_p1_backblaze_b2_readonly_v223.py scripts/p1_b2_codespace_probe_v223.py tests/test_p1_b2_codespace_probe_v223.py scripts/p1_b2_isolated_launcher_v223.py tests/test_p1_b2_isolated_launcher_v223.py scripts/p1_b2_preupload_integrity_v223.py tests/test_p1_b2_preupload_integrity_v223.py tests/test_p1_external_custodian_pg17_v223.py scripts/jw_key_escrow_v223.py tests/test_jw_key_escrow_v223.py scripts/jw_rekey_candidate_v223.py tests/test_jw_rekey_candidate_v223.py
      - name: Run isolated P1 V5 regressions
        run: python -m pytest --noconftest -q tests/test_p1_backup_integrity_v5.py tests/test_p1_owner_one_shot_v223.py tests/test_p1_owner_archive_inventory_v223.py tests/test_p1_owner_archive_deep_v223.py tests/test_p1_constraint_deparser_v5.py tests/test_p1_owner_offline_restore_v223.py tests/test_p1_owner_vault_readback_v223.py tests/test_p1_owner_vault_upload_v223.py tests/test_p1_owner_remote_recovery_v223.py tests/test_p1_cleanroom_key_recovery_v223.py tests/test_p1_external_custodian_pg17_v223.py tests/test_p1_external_worm_compliance_v223.py tests/test_p1_owner_vault_scope_pin_v223.py tests/test_p1_backblaze_b2_readonly_v223.py tests/test_p1_b2_codespace_probe_v223.py tests/test_p1_b2_isolated_launcher_v223.py tests/test_p1_b2_preupload_integrity_v223.py tests/test_jw_key_escrow_v223.py
      - name: Run isolated synthetic candidate rekey tests
        run: PYTHONPATH=scripts python -m pytest --noconftest -q tests/test_jw_rekey_candidate_v223.py
      - name: Run independent recovery review regression in separate Python process
        run: python -m pytest --noconftest -q tests/jw_independent_review tests/test_naruv_b2_offline_stage.py tests/test_naruv_offline_recovery_package.py tests/test_naruv_owner_b2_acquire.py tests/test_naruv_owner_restore_receipt_review.py tests/test_naruv_owner_b2_metadata_review.py

  synthetic-pg17-restore:
    name: PG17 synthetic backup and isolated restore (no production data)
    if: github.repository == 'guccizz1k/JARVIS-WORKS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout review commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact reviewed source SHA
        env:
          JW_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$JW_EXPECTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10' 'cryptography>=43,<47' 'psycopg[binary]>=3.2,<4'
      - name: Launch two disposable PostgreSQL 17 instances on loopback
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name jw-p1-source -p 127.0.0.1:55432:5432 -e POSTGRES_PASSWORD=synthetic_only_change_not_needed postgres:17
          docker run -d --name jw-p1-target -p 127.0.0.1:55433:5432 -e POSTGRES_PASSWORD=synthetic_only_change_not_needed postgres:17
          for attempt in $(seq 1 40); do
            if docker exec jw-p1-source pg_isready -U postgres -d postgres >/dev/null && docker exec jw-p1-target pg_isready -U postgres -d postgres >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Expose PostgreSQL 17 client tools through ephemeral containers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jw-pg17-bin"
          for cli in pg_dump pg_restore; do
            cat > "$RUNNER_TEMP/jw-pg17-bin/$cli" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          tool="$(basename "$0")"
          exec docker run --rm -i --network host --user "$(id -u):$(id -g)" -v /tmp:/tmp -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE -e PGSSLROOTCERT postgres:17 "$tool" "$@"
          SCRIPT
            chmod +x "$RUNNER_TEMP/jw-pg17-bin/$cli"
          done
          echo "$RUNNER_TEMP/jw-pg17-bin" >> "$GITHUB_PATH"
      - name: Verify client and isolated test entrypoints
        run: |
          pg_dump --version
          pg_restore --version
          python -m py_compile scripts/pg_backup_v223.py tests/test_p1_pg17_synthetic_e2e.py scripts/p1_owner_offline_restore_v223.py scripts/p1_external_custodian_pg17_v223.py tests/test_p1_external_custodian_pg17_integration_v223.py
      - name: Run actual PG17 synthetic source to disposable target restore
        run: python -m pytest --noconftest -q tests/test_p1_pg17_synthetic_e2e.py tests/test_p1_external_custodian_pg17_integration_v223.py
      - name: Require real synthetic PG17 catalog and authorization assertions
        run: python -m scripts.jw_independent_ci_receipt_v223
      - name: Verify V5 historical baseline against separate PG17 restore (synthetic only)
        env:
          JW_V5_SYNTHETIC_CI: '1'
        run: python -m pytest --noconftest -q -s tests/test_p1_historical_baseline_pg17_integration_v223.py
      - name: Verify full role graph mutations and reversals (synthetic only)
        env:
          JW_ROLE_GRAPH_SYNTHETIC_CI: '1'
        run: python -m pytest --noconftest -q -s tests/test_jw_pg17_role_graph_integration_v223.py
      - name: Verify full ACL restore and effective RLS in separate synthetic PG17 clusters
        env:
          JW_SYNTHETIC_ACL_RESTORE_CI: '1'
        run: python -m pytest --noconftest -q -s tests/test_naruv_pg17_acl_restore_integration.py
      - name: Verify source package with offline Python wheels and cached PG17
        run: bash scripts/naruv_offline_runtime_ci.sh
      - name: Remove disposable PostgreSQL 17 instances
        if: always()
        shell: bash
        run: docker rm -f jw-p1-source jw-p1-target >/dev/null 2>&1 || true

  staging-qa-adapter-compat:
    name: P1 + pinned V22.3 QA adapter and original UI preservation
    if: github.repository == 'guccizz1k/JARVIS-WORKS'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact review candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact reviewed source SHA
        env:
          JW_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$JW_EXPECTED_SHA"
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated QA test dependencies (no source credentials)
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify protected QA adapter and P1 compatibility
        run: |
          python -m py_compile app/import_engine.py app/owner_review_app_v223.py app/owner_review_hosted_one_shot_v223.py scripts/ci_v223_render_hosted_e2e.py app/owner_review_public_qa_guard_v223.py scripts/pg_backup_v223.py scripts/p1_owner_offline_restore_v223.py
          python -m pytest --noconftest -q tests/test_v223_public_qa_gate.py tests/test_v223_review_isolation.py tests/test_v223_owner_approved_ui_pin.py tests/test_v223_order_review.py tests/test_v223_review_target_boundary.py tests/test_v223_owner_visual_server.py tests/test_v223_approved_review_server.py tests/test_v223_document_to_settlement_e2e.py tests/test_v223_xlsx_package_integrity.py tests/test_ci_v223_render_hosted_e2e.py tests/test_v223_render_resident_one_shot.py
          node --test tests/test_v223_review_operational_panels.cjs

  integrated-owner-browser:
    name: V22.3 integrated real-browser HTTPS business flow (synthetic only)
    if: github.repository == 'guccizz1k/JARVIS-WORKS' && github.event_name == 'pull_request' && github.base_ref == 'review/jw-v223-render-qa-pinned-20261122'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      JW_ENV: review
      JW_NO_EXTERNAL_DATABASE: '1'
    steps:
      - name: Checkout exact integration review SHA, no stored GitHub token
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact reviewed source SHA
        env:
          JW_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$JW_EXPECTED_SHA"
      - name: Set up isolated Python browser runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only dependencies and pinned Chromium/WebKit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-dev.txt 'playwright==1.56.0'
          python -m playwright install --with-deps chromium webkit
      - name: Execute existing genuine browser UI, HTTPS and transaction checks
        shell: bash
        run: |
          set -euo pipefail
          test "$JW_ENV" = review
          test "$JW_NO_EXTERNAL_DATABASE" = 1
          python -m scripts.ci_v223_owner_review_browser
      - name: Explicit environment boundary
        if: always()
        run: echo 'Only ephemeral localhost TLS, synthetic SQLite, Chromium/WebKit; no Render, production DB, external key, backup or live release.'
