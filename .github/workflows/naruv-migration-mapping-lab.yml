name: NARUV isolated migration mapping lab
on:
  pull_request:
    branches: [main]
    paths:
      - app/erp_migration_mapping.py
      - tests/test_erp_migration_mapping.py
      - app/erp_migration_review.py
      - tests/test_erp_migration_review.py
      - app/erp_migration_preflight.py
      - tests/test_erp_migration_preflight.py
      - app/erp_migration_approval.py
      - tests/test_erp_migration_approval.py
      - db/review/naruv_approval_pg17_lab.sql
      - scripts/naruv_approval_pg17_lab.py
      - db/review/naruv_atomic_fixture_pg17_lab.sql
      - scripts/naruv_atomic_fixture_pg17_lab.py
      - app/erp_migration_recovery.py
      - tests/test_erp_migration_recovery.py
      - scripts/naruv_recovery_pg17_lab.py
      - scripts/naruv_backup_restore_pg17_lab.py
      - scripts/naruv_independent_restore_pg17_lab.py
      - app/erp_migration_csv.py
      - tests/test_erp_migration_csv.py
      - app/erp_migration_xlsx.py
      - app/erp_migration_file_stage.py
      - tests/test_erp_migration_file_stage.py
      - app/erp_migration_file_transaction.py
      - db/review/naruv_file_transaction_pg17_lab.sql
      - scripts/naruv_file_transaction_pg17_lab.py
      - tests/test_file_transaction_contract_local.py
      - app/naruv_native_file_preview.py
      - db/review/naruv_native_file_preview_ci.sql
      - scripts/naruv_native_file_preview_ci.py
      - app/naruv_native_write_review.py
      - db/review/naruv_native_write_review_ci.sql
      - scripts/naruv_native_write_review_ci.py
      - db/review/naruv_customer_bridge_ci.sql
      - scripts/naruv_customer_bridge_ci.py
      - db/review/naruv_inventory_ci.sql
      - app/naruv_inventory_review.py
      - scripts/naruv_inventory_ci.py
      - db/review/naruv_trade_ci.sql
      - app/naruv_trade_review.py
      - scripts/naruv_trade_ci.py
      - db/review/naruv_finance_ci.sql
      - app/naruv_finance_review.py
      - scripts/naruv_finance_ci.py
      - db/review/naruv_accounting_ci.sql
      - app/naruv_accounting_review.py
      - scripts/naruv_accounting_ci.py
      - db/review/naruv_bundle_ci.sql
      - app/naruv_bundle_review.py
      - scripts/naruv_bundle_ci.py
      - db/review/naruv_quote_bundle_ci.sql
      - app/naruv_quote_bundle_review.py
      - scripts/naruv_quote_bundle_ci.py
      - db/review/naruv_production_ci.sql
      - app/naruv_production_review.py
      - scripts/naruv_production_ci.py
      - db/review/naruv_valuation_ci.sql
      - app/naruv_valuation_review.py
      - scripts/naruv_valuation_ci.py
      - scripts/naruv_erp_restore_ci.py
      - tests/test_naruv_workflow_context.py
      - app/naruv_integrated_review.py
      - tests/test_naruv_integrated_review.py
      - app/naruv_works_stage_entry.py
      - app/naruv_document_review.py
      - app/naruv_payroll_draft.py
      - tests/test_naruv_document_payroll.py
      - app/naruv_draft_review.py
      - db/review/naruv_draft_ci.sql
      - scripts/naruv_draft_ci.py
      - app/naruv_hr_review.py
      - db/review/naruv_hr_ci.sql
      - .github/workflows/naruv-migration-mapping-lab.yml
permissions:
  contents: read
concurrency:
  group: naruv-migration-mapping-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  mapping-lab:
    name: NARUV metadata-only migration lab
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Isolated standard-library tests in five fresh processes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile app/erp_migration_mapping.py tests/test_erp_migration_mapping.py
          for seed in 17 101 617 2027 65537; do
            NARUV_TEST_SEED="$seed" PYTHONHASHSEED="$seed" python - <<'PY'
          import os, unittest
          suite=unittest.defaultTestLoader.loadTestsFromName("tests.test_erp_migration_mapping")
          result=unittest.TextTestRunner(verbosity=1).run(suite)
          if not result.wasSuccessful() or result.testsRun != 12 or result.skipped or result.expectedFailures or result.unexpectedSuccesses:
              raise SystemExit(1)
          print("NARUV_MAPPING_ROUND_PASS", os.environ["NARUV_TEST_SEED"], "12 cases; 100 permutations; 100 unknown-header mutations")
          PY
          done
          echo 'NARUV_MAPPING_LAB_PASS 5 rounds; no row import or ERP connection'

      - name: Offline document binding and synthetic payroll drafts
        run: |
          set -euo pipefail
          python -m py_compile app/naruv_document_review.py app/naruv_payroll_draft.py tests/test_naruv_document_payroll.py
          for seed in 17 101 617 2027 65537; do
            PYTHONHASHSEED="$seed" python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.loadTestsFromName("tests.test_naruv_document_payroll")
          r=unittest.TextTestRunner(verbosity=1).run(suite)
          if not r.wasSuccessful() or r.testsRun != 21 or r.skipped or r.expectedFailures or r.unexpectedSuccesses:
              raise SystemExit(1)
          PY
          done

      - name: Separate scoped metadata binding tests in five fresh processes
        run: |
          set -euo pipefail
          python -m py_compile app/erp_migration_review.py tests/test_erp_migration_review.py
          for seed in 17 101 617 2027 65537; do
            NARUV_TEST_SEED="$seed" PYTHONHASHSEED="$seed" python - <<'PY'
          import os, unittest
          suite=unittest.defaultTestLoader.loadTestsFromName("tests.test_erp_migration_review")
          result=unittest.TextTestRunner(verbosity=1).run(suite)
          if not result.wasSuccessful() or result.testsRun != 8 or result.skipped or result.expectedFailures or result.unexpectedSuccesses:
              raise SystemExit(1)
          print("NARUV_REVIEW_ROUND_PASS", os.environ["NARUV_TEST_SEED"], "8 cases; 100 varied reviews; 200 scope/order negative controls")
          PY
          done
          echo 'NARUV_REVIEW_LAB_PASS 5 rounds; metadata only; no import authority'

      - name: Bounded row preflight in five fresh processes
        run: |
          set -euo pipefail
          python -m py_compile app/erp_migration_preflight.py tests/test_erp_migration_preflight.py
          for seed in 17 101 617 2027 65537; do
            NARUV_TEST_SEED="$seed" PYTHONHASHSEED="$seed" python - <<'PY'
          import os, unittest
          suite=unittest.defaultTestLoader.loadTestsFromName("tests.test_erp_migration_preflight")
          result=unittest.TextTestRunner(verbosity=1).run(suite)
          if not result.wasSuccessful() or result.testsRun != 14 or result.skipped or result.expectedFailures or result.unexpectedSuccesses:
              raise SystemExit(1)
          print("NARUV_PREFLIGHT_ROUND_PASS", os.environ["NARUV_TEST_SEED"], "14 cases; 100 varied batches; 300 negative controls; maximum batch 1000 and target IDs 10000")
          PY
          done
          echo 'NARUV_PREFLIGHT_LAB_PASS 5 rounds; no data writes or import authority'

      - name: Isolated approval and reservation lifecycle adversarial tests
        run: |
          set -euo pipefail
          python -m py_compile app/erp_migration_approval.py tests/test_erp_migration_approval.py
          for seed in 17 101 617 2027 65537; do
            NARUV_TEST_SEED="$seed" PYTHONHASHSEED="$seed" python - <<'PY'
          import os, unittest
          suite=unittest.defaultTestLoader.loadTestsFromName("tests.test_erp_migration_approval")
          result=unittest.TextTestRunner(verbosity=1).run(suite)
          if not result.wasSuccessful() or result.testsRun != 18 or result.skipped or result.expectedFailures or result.unexpectedSuccesses:
              raise SystemExit(1)
          print("NARUV_APPROVAL_ROUND_PASS", os.environ["NARUV_TEST_SEED"], "18 cases; 100 varied approvals; 300 negative controls; 16 concurrent claims; revoke/claim race")
          PY
          done
          echo 'NARUV_APPROVAL_LAB_PASS 5 rounds; process-local reservation only; no import authority'

      - name: CSV byte input and existing preflight integration
        run: |
          set -euo pipefail
          python -m py_compile app/erp_migration_csv.py tests/test_erp_migration_csv.py
          for seed in 17 101 617 2027 65537; do
            NARUV_TEST_SEED="$seed" PYTHONHASHSEED="$seed" python - <<'PY'
          import os, unittest
          suite=unittest.defaultTestLoader.loadTestsFromName("tests.test_erp_migration_csv")
          result=unittest.TextTestRunner(verbosity=1).run(suite)
          if not result.wasSuccessful() or result.testsRun != 14 or result.skipped or result.expectedFailures or result.unexpectedSuccesses:
              raise SystemExit(1)
          print("NARUV_CSV_ROUND_PASS",os.environ["NARUV_TEST_SEED"],"14 cases; 100 varied CSV oracle comparisons; 300 negative controls")
          PY
          done
          echo 'NARUV_CSV_LAB_PASS 5 rounds; existing preflight reused; no import authority'

  approval-pg17-lab:
    name: NARUV disposable PG17 approval transaction lab
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: naruv-ci-root-fixture
          POSTGRES_DB: naruv_approval_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d naruv_approval_ci"
          --health-interval 5s --health-timeout 3s --health-retries 8
    env:
      NARUV_APPROVAL_PG_ALLOW: ONLY_DISPOSABLE_CI
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install existing pinned PG driver
        run: python -m pip install -r requirements-pg-stage.txt
      - name: Run isolated PostgreSQL17 approval tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile scripts/naruv_approval_pg17_lab.py
          python -m scripts.naruv_approval_pg17_lab

  atomic-fixture-pg17-lab:
    name: NARUV disposable PG17 atomic synthetic item lab
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: naruv-ci-root-fixture
          POSTGRES_DB: naruv_approval_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d naruv_approval_ci"
          --health-interval 5s --health-timeout 3s --health-retries 8
    env:
      NARUV_APPROVAL_PG_ALLOW: ONLY_DISPOSABLE_CI
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install existing pinned PG driver
        run: python -m pip install -r requirements-pg-stage.txt
      - name: Run isolated PostgreSQL17 atomic fixture tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile scripts/naruv_atomic_fixture_pg17_lab.py
          python -m scripts.naruv_atomic_fixture_pg17_lab

  recovery-pg17-lab:
    name: NARUV disposable PG17 crash recovery lab
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: naruv-ci-root-fixture
          POSTGRES_DB: naruv_approval_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d naruv_approval_ci"
          --health-interval 5s --health-timeout 3s --health-retries 8
    env:
      NARUV_APPROVAL_PG_ALLOW: ONLY_DISPOSABLE_CI
      NARUV_RECOVERY_ALLOW: ONLY_JOB_POSTGRES_SERVICE
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install existing pinned PG driver
        run: python -m pip install -r requirements-pg-stage.txt
      - name: Run isolated PostgreSQL17 crash recovery tests
        env:
          NARUV_RECOVERY_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile scripts/naruv_recovery_pg17_lab.py app/erp_migration_recovery.py tests/test_erp_migration_recovery.py
          python -m unittest tests.test_erp_migration_recovery
          python -m scripts.naruv_recovery_pg17_lab

  backup-restore-pg17-lab:
    name: NARUV disposable PG17 logical backup restore lab
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: naruv-ci-root-fixture
          POSTGRES_DB: naruv_approval_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d naruv_approval_ci"
          --health-interval 5s --health-timeout 3s --health-retries 8
    env:
      NARUV_APPROVAL_PG_ALLOW: ONLY_DISPOSABLE_CI
      NARUV_RECOVERY_ALLOW: ONLY_JOB_POSTGRES_SERVICE
      NARUV_BACKUP_ALLOW: ONLY_FRESH_CI_DATABASES
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install existing pinned PG driver
        run: python -m pip install -r requirements-pg-stage.txt
      - name: Run isolated PostgreSQL17 backup restore tests
        env:
          NARUV_RECOVERY_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile scripts/naruv_backup_restore_pg17_lab.py
          python -m scripts.naruv_backup_restore_pg17_lab

  independent-restore-pg17-lab:
    name: NARUV independent disposable PG17 cluster restore lab
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: naruv-ci-root-fixture
          POSTGRES_DB: naruv_approval_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d naruv_approval_ci"
          --health-interval 5s --health-timeout 3s --health-retries 8
      destination:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: naruv-independent-root-fixture
          POSTGRES_DB: naruv_independent_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d naruv_independent_ci"
          --health-interval 5s --health-timeout 3s --health-retries 8
    env:
      NARUV_INDEPENDENT_ALLOW: ONLY_TWO_DISPOSABLE_CI_SERVICES
      NARUV_APPROVAL_PG_ALLOW: ONLY_DISPOSABLE_CI
      NARUV_RECOVERY_ALLOW: ONLY_JOB_POSTGRES_SERVICE
      NARUV_BACKUP_ALLOW: ONLY_FRESH_CI_DATABASES
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install existing pinned PG driver
        run: python -m pip install -r requirements-pg-stage.txt
      - name: Run independent PostgreSQL17 cluster restore
        env:
          NARUV_RECOVERY_SERVICE_ID: ${{ job.services.postgres.id }}
          NARUV_INDEPENDENT_SERVICE_ID: ${{ job.services.destination.id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile scripts/naruv_independent_restore_pg17_lab.py
          python -m scripts.naruv_independent_restore_pg17_lab

  file-stage-lab:
    name: NARUV strict XLSX and CSV source-bound staging lab
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install existing compatible workbook fixture generator
        run: python -m pip install openpyxl==3.1.5
      - name: Run strict file-stage tests in five fresh processes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile app/erp_migration_xlsx.py app/erp_migration_file_stage.py tests/test_erp_migration_file_stage.py
          for seed in 17 101 617 2027 65537; do
            NARUV_TEST_SEED="$seed" PYTHONHASHSEED="$seed" python - <<'PY'
          import os, unittest
          suite=unittest.defaultTestLoader.loadTestsFromName("tests.test_erp_migration_file_stage")
          result=unittest.TextTestRunner(verbosity=1).run(suite)
          if not result.wasSuccessful() or result.testsRun!=14 or result.skipped or result.expectedFailures or result.unexpectedSuccesses:
              raise SystemExit(1)
          print("NARUV_FILE_STAGE_ROUND_PASS",os.environ["NARUV_TEST_SEED"],"14 cases; 20 actual workbook variations")
          PY
          done
          echo 'NARUV_FILE_STAGE_LAB_PASS 5 rounds; source binding only; no import authority'

  file-transaction-pg17-lab:
    name: NARUV disposable file transaction PG17 (round ${{ matrix.round }})
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: naruv-ci-root-fixture
          POSTGRES_DB: naruv_approval_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d naruv_approval_ci"
          --health-interval 5s --health-timeout 3s --health-retries 8
    env:
      NARUV_APPROVAL_PG_ALLOW: ONLY_DISPOSABLE_CI
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-pg-stage.txt openpyxl==3.1.5 pytest==8.3.5
      - name: Validate isolated service and execute file transaction tests
        env:
          NARUV_FILE_TX_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$NARUV_FILE_TX_SERVICE_ID"
          NARUV_FILE_TX_SERVER_ADDR="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$NARUV_FILE_TX_SERVICE_ID")"
          export NARUV_FILE_TX_SERVER_ADDR
          python -c "import ipaddress, os; assert ipaddress.ip_address(os.environ['NARUV_FILE_TX_SERVER_ADDR']).version == 4"
          python -m py_compile app/erp_migration_file_transaction.py scripts/naruv_file_transaction_pg17_lab.py tests/test_file_transaction_contract_local.py
          python -m pytest -q tests/test_file_transaction_contract_local.py
          python -m scripts.naruv_file_transaction_pg17_lab

  native-file-preview-pg17:
    name: NARUV native session file preview PG17 (round ${{ matrix.round }})
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      JW_ENV: review
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-only-ephemeral-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install existing staged API test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-pg-stage.txt openpyxl==3.1.5
      - name: Verify real native session file preview in fresh PG17
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile app/naruv_native_file_preview.py scripts/naruv_native_file_preview_ci.py
          python -m scripts.naruv_native_file_preview_ci

  native-file-write-pg17:
    name: NARUV native approval and write PG17 (round ${{ matrix.round }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      erp_restore:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: naruv-erp-restore-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NARUV_ERP_RESTORE_ALLOW: TWO_DISPOSABLE_SERVICES_ONLY
      JW_ENV: review
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-only-ephemeral-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install existing staged API test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-pg-stage.txt openpyxl==3.1.5
      - name: Verify native file stage approval and atomic PG17 write
        env:
          NARUV_ERP_SOURCE_SERVICE: ${{ job.services.postgres.id }}
          NARUV_ERP_DEST_SERVICE: ${{ job.services.erp_restore.id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile app/naruv_native_file_preview.py app/naruv_native_write_review.py scripts/naruv_native_write_review_ci.py scripts/naruv_customer_bridge_ci.py app/naruv_inventory_review.py scripts/naruv_inventory_ci.py app/naruv_trade_review.py scripts/naruv_trade_ci.py app/naruv_finance_review.py scripts/naruv_finance_ci.py app/naruv_accounting_review.py scripts/naruv_accounting_ci.py app/naruv_bundle_review.py scripts/naruv_bundle_ci.py app/naruv_quote_bundle_review.py scripts/naruv_quote_bundle_ci.py app/naruv_production_review.py scripts/naruv_production_ci.py app/naruv_valuation_review.py scripts/naruv_valuation_ci.py scripts/naruv_erp_restore_ci.py
          python -m unittest tests.test_naruv_workflow_context tests.test_naruv_integrated_review
          python -m scripts.naruv_native_write_review_ci
