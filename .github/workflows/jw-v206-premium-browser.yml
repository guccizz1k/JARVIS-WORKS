name: JW V20.6 premium translucent white dark right rail UI E2E
on:
  push:
    branches:
      - review/v206-premium-translucent-right-rail-20261102
permissions:
  contents: read
concurrency:
  group: jw-v206-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      JW_ENV: review
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate 1-3 source-only scope, syntax and CSS validation
        run: |
          set -eu
          python -m py_compile scripts/ci_v206_premium_browser.py
          node --check app/static/premium_v206.js
          node --check app/static/sunset_v204.js
          node --check app/static/app.js
          python -m pip -q install 'tinycss2>=1.2,<2'
          python - <<'PY'
          from pathlib import Path
          import subprocess,tinycss2
          base='1f7c7307fa6bf4575ea7851fe7ae7d79e7caa1be'
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={'app/static/index.html','app/static/motion_v203.js','app/static/premium_v206.js','app/static/premium_v206.css',
                   'scripts/ci_v206_premium_browser.py','.github/workflows/jw-v206-premium-browser.yml',
                   '.github/workflows/jw-j1-j6-unified-acceptance.yml'}
          assert changed<=allowed,changed-allowed
          for path in ('app/static/app.js','app/main.py','app/static/premium_v205.js',
                       'app/static/sunset_v204.js','.github/workflows/jw-j1-j6-unified-acceptance.yml'):
            original=subprocess.check_output(['git','show',base+':'+path])
            assert Path(path).read_bytes()==original,path
          h=Path('app/static/index.html').read_text()
          assert h.index('data-page="imports"')<h.index('data-page="dashboard"')
          assert h.index('premium_v205.css')<h.index('premium_v206.css')
          assert h.index('premium_v205.js')<h.index('premium_v206.js')
          css=Path('app/static/premium_v206.css').read_text()
          issues=[t for t in tinycss2.parse_stylesheet(css,skip_comments=True,skip_whitespace=True) if t.type=='error']
          assert not issues,issues
          script=Path('app/static/premium_v206.js').read_text()
          assert 'dashboardPage=function premiumV206Dashboard' in script
          assert 'data-jw206-theme' in script and 'jw206-more-toggle' in script
          assert 'fetch(' not in script and 'XMLHttpRequest' not in script
          assert '.nav-item[hidden]' in css and 'prefers-reduced-motion' in css
          print('PASS_V206_GATES_1_2_3_SOURCE_CSS_PROTECTION',flush=True)
          PY
      - name: Chromium with dependencies
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Gate 4-5 real browser 10 routes light dark right rail modal and permissions
        run: python -m scripts.ci_v206_premium_browser
      - name: Attach screenshot proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jw-v206-premium-real-browser-screens
          path: artifacts/v206-premium-review/
          if-no-files-found: ignore
          retention-days: 14
