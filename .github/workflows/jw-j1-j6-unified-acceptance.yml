name: JW J1-J6 unified engineering acceptance (review only)

on:
  push:
    branches:
      - review/j1-j6-unified-acceptance-20261024
      - review/v91-live-pg-gateway-alignment-20261024
      - review/v92-postgres-quote-write-j1j6-20261025
      - review/v93-supabase-https-pg-read-recovery-20261025
      - review/v94-pg-tls-ipv6-preflight-20261025
      - review/v95-supavisor-session-tls-20261025
      - review/v96-supavisor-root-ca-tls-20261025
      - review/v97-restricted-supavisor-login-20261025
      - review/v98-supavisor-hop-aware-ssl-20261025
      - review/v99-v110-eight-stage-acceptance-20261025
      - review/v131-abc-finance-rollback-20261030
      - review/v156-j1j6-baseline-ci-fix-20261030
      - review/v157-real-pg17-delivery-http-concurrency-20261030
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jw-j1-j6-unified-20261024
  cancel-in-progress: true

jobs:
  full-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: J1 original history and immutable product baseline
        run: |
          git merge-base --is-ancestor 4fe542b9c5676ae3ee5237504426a938e422cd42 HEAD
          git merge-base --is-ancestor a3783ef9f7aeeeff655f1f0ac376f6d8edf5b338 HEAD
          git merge-base --is-ancestor efc7dbab8fed5f7291bde1512da5f11566dd9e4e HEAD
          test "$(git rev-parse HEAD:app/main.py)" = "0ede250ddbcf98b19f7747c8781ca4c8aa95e738"
          git diff --exit-code efc7dbab8fed5f7291bde1512da5f11566dd9e4e HEAD -- app/main.py app/static/ migrations/ security/ requirements.txt requirements-dev.txt
          git diff --exit-code efc7dbab8fed5f7291bde1512da5f11566dd9e4e HEAD -- db/ ':!db/review/ci_v92_quote_ephemeral.sql' ':!db/review/v99_live_tenant_row_read_rollback.sql' ':!db/review/v99_live_customer_withcheck_rollback.sql' ':!db/review/v108_source_schema_fingerprints.json'
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(
            ["git","diff","--name-only","c29a955dc2afd28d4d283838bddef617b3487bc7","HEAD","--","app/"],text=True).splitlines())
          allowed = {"app/pg_connection_gate_v87.py","app/pg_delivery_evidence_gate_v147.py","app/pg_delivery_request_limit_v155.py","app/pg_delivery_review_api_v154.py","app/pg_delivery_review_console_v155.py","app/pg_delivery_review_reservation_v151.py","app/pg_dev_entry_v92.py","app/pg_dev_entry_v93.py","app/pg_invoice_preview_v145.py","app/pg_live_dryrun_v88.py","app/pg_quote_api_v92.py","app/pg_quote_read_v93.py","app/pg_signup_review_gate_v146.py"}
          assert changed <= allowed, {"unreviewed_app_changes":sorted(changed-allowed)}
          assert "app/main.py" not in changed
          assert all(not file.startswith("app/static/") for file in changed)
          print("PASS: immutable production entry and explicit reviewed PostgreSQL-only additions")
          print("PASS: reviewed V8.7–V15.5 additions only; original production backend unchanged")
          PY
      - name: Install product regression prerequisites
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt
          python -m pip install 'PyMuPDF==1.26.7' 'reportlab==4.4.9'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum tesseract-ocr tesseract-ocr-kor
      - name: J1 to J6 whole-suite one-run zero-skip validation
        run: |
          python scripts/ci_rebuild_v79_overlay.py
          python -m pytest -q tests -ra --junitxml=jw-j1-j6-suite.xml
          python -m scripts.jw_integrated_acceptance --junit jw-j1-j6-suite.xml
      - name: Record completed full-suite evidence
        run: |
          python - <<'PY'
          import json,os,pathlib
          pathlib.Path("receipt-full.json").write_text(json.dumps({"id":"j1-j6-legacy-product","status":"PASS",
            "synthetic":True,"proof":"full original plus added tests; actual JUnit jw-j1-j6-suite.xml",
            "commit":os.environ["GITHUB_SHA"]}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-j1j6-regression-junit
          path: jw-j1-j6-suite.xml
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jw-j1j6-receipt-full
          path: receipt-full.json
          retention-days: 3

  chromium-financial-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      JW_ENV: review
      JW_INSECURE_LOCAL_DEV: '1'
      DEMO_SEED: '1'
      JW_BROWSER_CI_ONLY: ISOLATED_LOOPBACK_DEMO
      JARVIS_DB_PATH: /tmp/jw-j1j6-browser-fixture.sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned app, Chromium and test dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install -g @playwright/cli@0.1.22
          playwright-cli install
          node --check app/static/app.js
          python -m py_compile scripts/ci_playwright_cli_quote_form_e2e.py
      - name: J3 real UI Chromium plus full browser-origin finance flow
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 > /tmp/jw-j1j6-uvicorn.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python -m scripts.ci_playwright_cli_smoke
          python -m scripts.ci_playwright_cli_document_e2e
          python -m scripts.ci_playwright_cli_quote_form_e2e
      - name: Record real Chromium evidence
        run: |
          python - <<'PY'
          import json,os,pathlib
          pathlib.Path("receipt-browser.json").write_text(json.dumps({"id":"j1-j6-web-form","status":"PASS",
            "synthetic":True,"proof":"real quote DOM submission, KRW 1440, financial API lifecycle, tenant A/B tests, screenshots",
            "commit":os.environ["GITHUB_SHA"]}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-j1j6-browser-screenshots
          path: artifacts/playwright-cli/
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jw-j1j6-receipt-browser
          path: receipt-browser.json
          retention-days: 3

  pg17-concurrency-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JW_ENV: review
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-only-ephemeral-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned PG and browser integration requirements
        run: |
          python -m pip install -r requirements.txt -r requirements-postgres-check.txt
          npm install -g @playwright/cli@0.1.22
          playwright-cli install
      - name: J3 J5 real isolated SQL RPC contention and restore
        run: |
          python -m scripts.ci_v90_postgres_browser
          python -m scripts.ci_j6_postgres_restore
          python -m scripts.ci_pg_v91_tls_gateway
      - name: Record actual ephemeral PG17 proof
        run: |
          python - <<'PY'
          import json,os,pathlib
          pathlib.Path("receipt-pg.json").write_text(json.dumps({"id":"j1-j6-pg-browser-restore",
            "status":"PASS","synthetic":True,
            "proof":"real ephemeral PG17 backend, nonprivileged verified-full TLS with wrong CA denial, multi-tenant V9 RPC, commit-order, rollback, custom dump restore",
            "commit":os.environ["GITHUB_SHA"]}))
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jw-j1j6-receipt-pg
          path: receipt-pg.json
          retention-days: 3

  security-methodology:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      JW_ENV: review
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: J4 J6 negative tests plus gate structure
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt
          python -m pytest -q tests/test_jw_evidence_gate.py tests/test_j6_postgres_restore.py tests/test_jw_integrated_acceptance.py -ra --junitxml=jw-j1j6-methodology.xml
          python scripts/jw_evidence_gate.py --check-project .
          python scripts/jw_evidence_gate.py --check docs/agents/V90_AGENT_ADOPTION_EVIDENCE.json
          python scripts/jw_evidence_gate.py --check docs/agents/J6_V90_NEXT_STAGE_EVIDENCE.json
      - name: J5 encrypted SQLite restore and J3 release remains BLOCKED
        run: |
          python -m scripts.recovery_gate_v72 > jw-j1j6-sqlite-recovery.json
          python - <<'PY'
          import json
          d=json.load(open("jw-j1j6-sqlite-recovery.json"))
          assert d["local_result"]=="PASS" and d["production_recovery_certified"] is False
          PY
          set +e
          python -m scripts.release_gate_v75 > jw-j1j6-release.json
          EXIT_CODE=$?
          set -e
          test "$EXIT_CODE" -eq 2
          python - <<'PY'
          import json
          r=json.load(open("jw-j1j6-release.json"))
          assert r["decision"]=="BLOCKED" and r["deployment_performed"] is False
          PY
      - name: J1 J3 limited Semgrep security detection
        run: |
          python -m pip install semgrep==1.182.1
          SEMGREP_SEND_METRICS=off python scripts/ci_semgrep_security.py
      - name: Record security and new-methodology success
        run: |
          python - <<'PY'
          import json,os,pathlib
          for gate,file,proof in (
             ("j1-j6-security","receipt-security.json","Semgrep 4 injection patterns, release BLOCKED, encrypted restore tamper rejected"),
             ("j1-j6-new-contract","receipt-new-contract.json","J1-J6 negative tests, glossary, strict release evidence checks")):
             pathlib.Path(file).write_text(json.dumps({"id":gate,"status":"PASS","synthetic":True,
               "proof":proof,"commit":os.environ["GITHUB_SHA"]}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-j1j6-methodology-junit
          path: |
            jw-j1j6-methodology.xml
            jw-j1j6-sqlite-recovery.json
            jw-j1j6-release.json
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jw-j1j6-receipt-security
          path: |
            receipt-security.json
            receipt-new-contract.json
          retention-days: 3

  pg17-v92-quote:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JW_ENV: review
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-only-ephemeral-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing application and PG test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt
      - name: J2 J3 J4 J5 J6 real nonprivileged PG17 quote API and failure injection
        run: python -m scripts.ci_pg_v92_quote_http

  pg17-v93-https-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JW_ENV: review
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_V93_TRUST_LOCAL_CA: EPHEMERAL_RUNNER_ONLY
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-only-ephemeral-test-password@127.0.0.1:5432/postgres
      PLAYWRIGHT_MCP_IGNORE_HTTPS_ERRORS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned existing Python/browser dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt
          python -m pip install 'websockets==17.2'
          npm install -g @playwright/cli@0.1.22
          playwright-cli install
          sudo apt-get update -qq
          sudo apt-get install -y libnss3-tools
      - name: Real Chromium HTTPS -> PG17 quote transactions + 13-table restore
        run: |
          python -m py_compile scripts/ci_v93_https_pg_browser.py scripts/ci_v93_finance_restore.py
          python -m scripts.ci_v93_https_pg_browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v93-https-pg-screenshot
          path: artifacts/playwright-cli/jw_v93_https_pg_quote.png
          retention-days: 3
          if-no-files-found: ignore

  j1-j6-independent-aggregate:
    needs: [full-product, chromium-financial-ui, pg17-concurrency-recovery, pg17-v92-quote, pg17-v93-https-restore, security-methodology]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: jw-j1j6-receipt-*
          path: receipts
          merge-multiple: true
      - name: J2 J3 full receipt aggregation, fail closed on missing work
        run: |
          python - <<'PY'
          import json,os,pathlib
          files=sorted(pathlib.Path("receipts").glob("*.json"))
          if len(files)!=5:raise SystemExit("BLOCKED: expected 5 successful-domain receipts")
          rec=[json.loads(f.read_text()) for f in files]
          if any(r.get("commit")!=os.environ["GITHUB_SHA"] for r in rec):
             raise SystemExit("BLOCKED: source SHA does not match receipt")
          manifest={"commit":os.environ["GITHUB_SHA"],"checks":rec,
            "release":"BLOCKED","production_deployed":False}
          pathlib.Path("jw-j1-j6-integrated-result.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY
          python -m scripts.jw_integrated_acceptance --receipts jw-j1-j6-integrated-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-j1j6-unified-review-verdict
          path: jw-j1-j6-integrated-result.json
          retention-days: 3
          if-no-files-found: ignore
