name: JW V23.0 Stage1 Three.js Global Infinity Login
on:
  push:
    branches:
      - review/v230-global-infinity-login-cinema-20261103
permissions:
  contents: write
concurrency:
  group: jw-v230-stage1
  cancel-in-progress: true
jobs:
  build-test-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      JW_ENV: review
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate 1 check allowed diff only, retain original app and security
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          base="888cd71f34b6fc021b5da6182d81acf25f7b2893"
          changed=set(subprocess.check_output(["git","diff","--name-only",base,"HEAD"],text=True).splitlines())
          allowed={"frontend/cinematic/InfinityMark.js","frontend/cinematic/PostPipeline.js",
          "frontend/cinematic/stage1.js","app/static/cinematic_v230_stage1.css",
          "app/static/cinematic_v230_stage1.bundle.js","app/static/index.html",
          "app/static/premium_v212.js","package.json","package-lock.json",
          "scripts/ci_v230_stage1_browser.py","scripts/ci_v230_stage1_record_video.py","tests/test_v230_visual_only_contract.py",
          ".github/workflows/jw-v230-global-infinity.yml"}
          assert changed.issubset(allowed),(changed-allowed)
          assert {"app/static/index.html","frontend/cinematic/stage1.js"}.issubset(changed)
          assert "PRODUCTION_BLOCKED" in Path("app/deployment_safety_v78.py").read_text()
          print("PASS_ONLY_PRESENTATION_FILES",len(changed))
          PY
      - name: Build pinned selfhosted Three.js, no runtime CDN
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run build:cinematic
          node --check frontend/cinematic/stage1.js
          node --check frontend/cinematic/InfinityMark.js
          node --check frontend/cinematic/PostPipeline.js
          node --check app/static/cinematic_v230_stage1.bundle.js
          test -s app/static/cinematic_v230_stage1.bundle.js
      - name: Install real browser and original backend requirements
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-nanum tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
          python -m pip install -r requirements.txt pytest pytest-asyncio httpx 'playwright>=1.50,<2' 'psycopg[binary]>=3,<4' 'PyMuPDF>=1.25,<2' reportlab
          python -m playwright install --with-deps chromium
      - name: Gate 1/2/3 stage1 source and business immutability
        run: python -m pytest -q -ra -p no:cacheprovider tests/test_v230_visual_only_contract.py
      - name: Gate 2/3/4/5 actual WebGL login transition, route, logout, reduced-motion
        run: python -m scripts.ci_v230_stage1_browser
      - name: Preserve original historical overlay provenance
        run: |
          python -m scripts.ci_rebuild_v79_overlay
          test -s ../overlay/BASE_SHA256.json
          test -s ../overlay/PAYLOAD_SHA256.json
      - name: Gate 1/2/3 entire repo with zero FAIL ERROR SKIP
        run: |
          mkdir -p artifacts/v230-regression
          python -m pytest -q -ra -p no:cacheprovider --basetemp=/tmp/jw-v230 --junitxml=artifacts/v230-regression/results.xml
          python - <<'PY'
          import xml.etree.ElementTree as E
          a=E.parse("artifacts/v230-regression/results.xml").getroot()
          d=a.attrib if a.tag=="testsuite" else a.find(".//testsuite").attrib
          n={k:int(d.get(k,0)) for k in ("tests","errors","failures","skipped")}
          assert n["tests"]>=2028 and n["errors"]==n["failures"]==n["skipped"]==0,n
          print("PASS_V230_FULL_REPO_NO_SKIPS",n)
          PY
      - name: Gate 4 - continuous real browser login, 3D transition and user tool clicks
        run: python -m scripts.ci_v230_stage1_record_video
      - name: Gate 5 - convert real Chromium capture into two verified iPhone MP4 videos
        run: |
          set -euo pipefail
          D=artifacts/v230-stage1-live-video
          test -s "$D/JARVIS_WORKS_V230_ACTUAL_BROWSER_RAW.webm"
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -i "$D/JARVIS_WORKS_V230_ACTUAL_BROWSER_RAW.webm" \
            -vf "fps=24,scale=1280:800:flags=lanczos" \
            -c:v libx264 -preset fast -crf 24 -pix_fmt yuv420p \
            -profile:v high -level 4.0 -movflags +faststart -an \
            "$D/JARVIS_WORKS_V230_REAL_LOGIN_AND_TOOLS_IPHONE.mp4"
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -i "$D/JARVIS_WORKS_V230_ACTUAL_BROWSER_RAW.webm" \
            -vf "fps=24,scale=960:600:flags=lanczos" \
            -c:v libx264 -preset fast -crf 29 -pix_fmt yuv420p \
            -profile:v main -level 3.1 -movflags +faststart -an \
            "$D/JARVIS_WORKS_V230_REAL_LOGIN_AND_TOOLS_LIGHT.mp4"
          ffprobe -v error -show_entries format=duration,size \
            -show_entries stream=codec_name,pix_fmt,width,height \
            -of json "$D/JARVIS_WORKS_V230_REAL_LOGIN_AND_TOOLS_IPHONE.mp4" > "$D/H264_VALIDATION.json"
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path("artifacts/v230-stage1-live-video")
          info=json.loads((d/"H264_VALIDATION.json").read_text())
          v=info["streams"][0]
          assert v["codec_name"]=="h264" and v["pix_fmt"]=="yuv420p",v
          assert (v["width"],v["height"])==(1280,800),v
          assert 25<float(info["format"]["duration"])<220,info
          assert int(info["format"]["size"])>150000,info
          proof=json.loads((d/"ACTUAL_VIDEO_INTERACTION_PROOF.json").read_text())
          assert proof["source"]=="ONE_CONTINUOUS_ACTUAL_CHROMIUM_RECORDING"
          assert proof["real_login"] and proof["real_logout"] and proof["three_js_global_single_canvas"]
          assert proof["real_business_tool_clicks"]==10 and proof["scroll_scenes"]==3
          assert not proof["browser_errors"] and not proof["http_5xx"]
          print("PASS_V230_IPHONE_MP4_METADATA",info)
          PY
          ffmpeg -hide_banner -loglevel error -nostdin \
            -i "$D/JARVIS_WORKS_V230_REAL_LOGIN_AND_TOOLS_IPHONE.mp4" -f null -
          ffmpeg -hide_banner -loglevel error -nostdin \
            -i "$D/JARVIS_WORKS_V230_REAL_LOGIN_AND_TOOLS_LIGHT.mp4" -f null -
          echo PASS_V230_FULL_VIDEO_DECODE_BOTH_IPHONE_FILES
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v230-stage1-all-source-and-visual-proofs
          path: |
            frontend/cinematic/
            app/static/index.html
            app/static/premium_v212.js
            app/static/cinematic_v230_stage1.css
            app/static/cinematic_v230_stage1.bundle.js
            package.json
            package-lock.json
            scripts/ci_v230_stage1_browser.py
            scripts/ci_v230_stage1_record_video.py
            tests/test_v230_visual_only_contract.py
            artifacts/v230-stage1-cinema/
            artifacts/v230-stage1-live-video/
            artifacts/v230-regression/results.xml
          retention-days: 7
          if-no-files-found: ignore
      - name: Pin exact TESTED vendor into review branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/v230-global-infinity-login-cinema-20261103"
          test -s package-lock.json
          test -s app/static/cinematic_v230_stage1.bundle.js
          git config user.name "JARVIS-WORKS QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json app/static/cinematic_v230_stage1.bundle.js
          if git diff --cached --quiet; then
            echo PASS_ALREADY_PINNED
          else
            git commit -m "build(stage1): tested offline Three.js web bundle"
            git push origin HEAD:refs/heads/review/v230-global-infinity-login-cinema-20261103
          fi
