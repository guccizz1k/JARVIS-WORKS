name: JW V21.5 desktop login and J3 provenance regression
on:
  push:
    branches:
      - review/v215-ui-j3-attestation-fix-20261102
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: jw-v215-ui-j3-review
  cancel-in-progress: true
jobs:
  isolated-ui-j3:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      JW_ENV: review
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate 1/3 - exact reviewed diff and syntax
        run: |
          set -euo pipefail
          python -m py_compile scripts/jw_j3_origin_gate.py scripts/ci_v215_j3_origin_tests.py scripts/ci_v215_login_viewport_browser.py
          node --check app/static/app.js
          node --check app/static/premium_v214.js
          python - <<'PY'
          import subprocess
          from pathlib import Path
          base='7289aeb7d670dbd41161a371bcfb861c9ddbe1cb'
          got=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          expected={'AGENTS.md','app/static/premium_v214.css',
            'scripts/jw_j3_origin_gate.py','scripts/ci_v215_j3_origin_tests.py',
            'scripts/ci_v215_login_viewport_browser.py',
            '.github/workflows/jw-v215-ui-j3-regression.yml'}
          assert got==expected,(got,expected)
          css=Path('app/static/premium_v214.css').read_text()
          assert 'max-height:920px' in css and 'max-height:790px' in css
          assert Path('app/deployment_safety_v78.py').read_text().find('PRODUCTION_BLOCKED')>=0
          print('PASS: scoped changes only; backend, auth, RLS and deployment guard unchanged')
          PY
      - name: Gate 3/5 - forgery replay and fail-closed tests
        run: python -m scripts.ci_v215_j3_origin_tests
      - name: Gate 3/5 - live GitHub read-only provenance smoke test
        run: |
          python - <<'PY'
          from scripts.jw_j3_origin_gate import github_json,REPO
          source='7289aeb7d670dbd41161a371bcfb861c9ddbe1cb'
          baseline='56453d680eb5db59f071adc938cc452471706b2e'
          run=github_json('actions/runs/41415951016')
          assert run['head_sha']==source and run['repository']['full_name']==REPO
          assert run['status']=='completed' and run['conclusion']=='success'
          assert github_json(f'commits/{source}')['sha']==source
          assert github_json(f'commits/{baseline}')['sha']==baseline
          print('PASS: exact SHA and successful GitHub Actions origin verified; not a product release claim')
          PY
      - name: Install isolated real-server Chromium dependencies
        run: |
          python -m pip install -r requirements.txt 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Gate 1/3/5 - rerun four previously unclassified pytest groups with real test dependencies
        run: |
          python -m pip install pytest pytest-asyncio httpx 'psycopg[binary]>=3,<4'
          python -m pytest -q tests/test_pg_rls_v19.py tests/test_rls_plan_v18.py tests/test_security.py tests/test_j6_postgres_restore.py tests/test_jw_evidence_gate.py
      - name: Gate 2/3/4 - V21.4 full browser regression
        run: python -m scripts.ci_v214_desktop_dark_browser
      - name: Gate 2/4 - V21.5 all desktop login first-fold acceptance
        run: python -m scripts.ci_v215_login_viewport_browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v215-login-j3-evidence
          path: |
            artifacts/v214-desktop/
            artifacts/v215-login/
          retention-days: 7
          if-no-files-found: ignore
