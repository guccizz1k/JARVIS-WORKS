# Owner-approved one isolated CI job. No merge, deployment, live DB, key or archive access.
name: NARUV P0-P3 wave5 integrated regressions
on:
  pull_request:
    branches: [review/naruv-gate5-qa-independent-login-20261127]
    paths: ['.github/workflows/naruv-p0-p3-wave5-review.yml']
permissions:
  contents: read
jobs:
  focused:
    if: github.repository == 'guccizz1k/JARVIS-WORKS' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      JW_NO_EXTERNAL_DATABASE: '1'
      JW_ENV: review
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: review
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 386077c311f23d313f60678d3e23692b0e070fbf
          path: source
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: d0b27be62555988942ebbd7dcfdd8a8fd54c6c55
          path: external
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install existing staged test dependencies
        run: |
          set -euo pipefail
          cd source
          python -m pip install -r requirements-dev.txt -r requirements-pg-stage.txt openpyxl==3.1.5
          python -m pip check
      - name: Pinned candidate tests and exact restoration
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -C review rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C source rev-parse HEAD)" = 386077c311f23d313f60678d3e23692b0e070fbf
          test "$(git -C external rev-parse HEAD)" = d0b27be62555988942ebbd7dcfdd8a8fd54c6c55
          (cd source && python scripts/naruv_v223_source_custody.py)
          p="$PWD/review/docs/review/p0-p3-wave2"
          test "$(git hash-object source/app/naruv_kr_payroll_review.py)" = 975d18358b050aaf0703599bed3a36e9592e3370
          test "$(git hash-object "$p/payroll-statement-candidate.py")" = ea4199c46f1e4704d19765f9c32124a407dd3ae4
          test "$(git hash-object source/app/erp_migration_xlsx.py)" = f96b84e4759cdc8274c2e7098691df3488038ec2
          test "$(git hash-object "$p/xlsx-candidate.py")" = cbf4b43ba75f9d5d52ef1442e68199741728a895
          test "$(git hash-object external/scripts/p1_cleanroom_key_recovery_v223.py)" = 4adbe97b6fa742e0ddc23fd2bdc8d109c67ef70f
          test "$(git hash-object "$p/cleanroom-pipe-candidate.py")" = a2162cec7e00bffe85cf341e73639423b91a74c4
          test "$(git hash-object "$p/test_paid_statement.py")" = d88ef34c3360c3cf794ea2beaa6c8058ed5e3e24
          test "$(git hash-object "$p/test_xlsx_mixed.py")" = 03c0ee598d805597a28185b41441d80530ec6bd8
          test "$(git hash-object "$p/test_cleanroom_pipe.py")" = 2706e13574526c7dd30317e66fc34c88dcf9de44
          q="$PWD/review/docs/review/p0-p3-wave5"
          test "$(git hash-object "$p/incident-evidence.py")" = cf9d0a0d3fadff0850d4c98e2bc3e59ed5d59ed7
          candidate="$RUNNER_TEMP/naruv-wave5"
          python "$q/build.py" "$p" "$candidate"
          cp "$p/test_incident.py" "$candidate/test_incident.py"
          export WAVE2_DIR="$p" WAVE5_OUT="$candidate"
          git -C source diff --exit-code
          git -C external diff --exit-code
          restore() {
            git -C source restore --source=HEAD -- app/naruv_kr_payroll_review.py app/erp_migration_xlsx.py
            git -C external restore --source=HEAD -- scripts/p1_cleanroom_key_recovery_v223.py
            git -C source diff --exit-code
            git -C external diff --exit-code
          }
          trap restore EXIT
          cp "$candidate/payroll-statement-candidate.py" source/app/naruv_kr_payroll_review.py
          cmp "$candidate/payroll-statement-candidate.py" source/app/naruv_kr_payroll_review.py
          cp "$candidate/xlsx-candidate.py" source/app/erp_migration_xlsx.py
          cmp "$candidate/xlsx-candidate.py" source/app/erp_migration_xlsx.py
          cp "$candidate/cleanroom-pipe-candidate.py" external/scripts/p1_cleanroom_key_recovery_v223.py
          cmp "$candidate/cleanroom-pipe-candidate.py" external/scripts/p1_cleanroom_key_recovery_v223.py
          (
            cd source
            export PYTHONPATH="$PWD"
            python -m py_compile app/naruv_kr_payroll_review.py app/erp_migration_xlsx.py
            python -m pytest -q --strict-markers "$q/test_source.py" "$candidate/test_incident.py" "$p/test_paid_statement.py" "$p/test_xlsx_mixed.py" tests/test_naruv_kr_payroll_review.py tests/test_erp_migration_file_stage.py
          )
          (
            cd external
            export PYTHONPATH="$PWD"
            python -m py_compile scripts/p1_cleanroom_key_recovery_v223.py
            python -m pytest -q --strict-markers "$q/test_recovery.py" "$p/test_cleanroom_pipe.py" tests/test_p1_cleanroom_key_recovery_v223.py
          )
          restore
          trap - EXIT
          (cd source && python scripts/naruv_v223_source_custody.py)
          echo P0_P3_WAVE5_INTEGRATED_PASS
      - name: Read-only QA HTTPS transport observation (not acceptance)
        run: |
          set -euo pipefail
          if result=$(curl --proto '=https' --tlsv1.2 --connect-timeout 5 --max-time 25 -sS -o /dev/null -w 'http_status=%{http_code} tls_verify=%{ssl_verify_result} total_seconds=%{time_total}' https://jw-v223-qa-pinned-20261122.onrender.com/); then
            printf 'QA_HTTPS_OBSERVATION_ONLY %s\n' "$result"
          else
            rc=$?
            printf 'QA_HTTPS_NOT_VERIFIED curl_exit=%s\n' "$rc"
          fi
