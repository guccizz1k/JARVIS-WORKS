name: JW V20.4 network-isolated parser candidate (review only)
on:
  push:
    branches:
      - review/v204-offline-parser-isolation-20261101
permissions:
  contents: read
concurrency:
  group: jw-v204-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JW_ENV: review
      JW_V204_ISOLATED: ONLY_DISPOSABLE_DOCKER_NETWORK_NONE
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing product parser and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Source syntax and production boundary guard
        run: |
          python -m py_compile scripts/review/v204_offline_parser.py scripts/ci_v204_offline_parser.py
          python - <<'PY'
          from pathlib import Path
          s=Path("scripts/review/v204_offline_parser.py").read_text()
          for x in ("--network=none","--read-only","--cap-drop=ALL",
                    "--security-opt=no-new-privileges","--pids-limit=32",
                    "--memory=768m","--user=65532:65532","--pull=never"):
              assert x in s,x
          assert "onrender.com" not in s and "SUPABASE_DSN" not in s
          print("PASS_V204_SOURCE_ISOLATION_GUARD")
          PY
      - name: Build single-purpose ephemeral parser image
        run: docker build --pull -f scripts/review/Dockerfile.v204 -t jw-v204-offline-import:ci .
      - name: Actual network-disabled container, 60 hostile cases and original document parity
        run: python -m scripts.ci_v204_offline_parser
      - name: Delete ephemeral image
        if: always()
        run: docker image rm -f jw-v204-offline-import:ci || true
