name: JW V18.3 outside-host HTTPS isolation proof (review only)
on:
  push:
    branches:
      - review/v183-external-https-boundary-20261031
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jw-v183-external-${{ github.ref }}
  cancel-in-progress: true
jobs:
  outside-host-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      JW_ENV: review
      JW_V183_READONLY_ACK: EXACT_ISOLATED_RENDER_STAGE_READONLY
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: J1 J3 independent fail-closed unit and mutation cases
        run: |
          python -m pytest -q tests/test_v183_hosted_boundary.py -ra --junitxml=v183-boundary.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('v183-boundary.xml').getroot()
          cases=list(root.iter('testcase'))
          assert len(cases)==27, len(cases)
          assert not any(c.find(t) is not None for c in cases for t in ('failure','error','skipped'))
          print('PASS_V183_27_LOCAL_GUARDS')
          PY
      - name: J5 externally hosted REAL TLS negative isolation matrix
        run: python -m scripts.ci_v183_hosted_boundary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v183-external-boundary-test-results
          path: v183-boundary.xml
          retention-days: 3
          if-no-files-found: ignore
