name: JW V17.8 real offline synthetic Korean OCR measurement (not production approval)

on:
  push:
    branches:
      - review/v178-ocr-synthetic-ground-truth-20261031
permissions:
  contents: read
concurrency:
  group: jw-v178-ocr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v178-actual-synthetic-ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      JW_ENV: review
      JW_OCR_SYNTHETIC_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline OCR only; install system Korean OCR + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng fonts-nanum
          python -m pip install -r requirements-dev.txt 'Pillow>=10,<14'
          tesseract --list-langs | grep -q '^kor$'
          tesseract --list-langs | grep -q '^eng$'
      - name: Gate 1, 2, 3 strict adversarial parser suite
        run: |
          python -m py_compile scripts/ci_v178_real_ocr_synthetic.py
          python -m pytest -q tests/test_v178_ocr_candidate_parser.py -ra --junitxml=v178-ocr-tests.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          tree=ET.parse('v178-ocr-tests.xml').getroot()
          s=tree if tree.tag=='testsuite' else tree.find('testsuite')
          assert s is not None and int(s.attrib.get('tests','0')) >= 40
          assert all(int(s.attrib.get(k,'0'))==0 for k in ('failures','errors','skipped'))
          print('PASS_V178_STRICT_40_OCR_ABSTENTION_ATTEMPTS')
          PY
      - name: Gate 4, 5 real OCR on 24 independent synthetic scans
        run: |
          python -m scripts.ci_v178_real_ocr_synthetic
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('v178-synthetic-ocr-report.json')
          d=json.loads(p.read_text())
          assert d['metric']=='V178_LABELED_SYNTHETIC_OCR_MEASUREMENT_ONLY'
          assert d['documents']==24
          assert d['report']['documents']==24
          assert d['report']['production_quality_approved'] is False
          assert d['customer_document_accuracy_measured'] is False
          assert d['business_auto_registration_approved'] is False
          assert d['production_ocr_readiness']=='BLOCKED'
          for field in ('counterparty','business_number','total_amount'):
              assert d['report']['fields'][field]['samples']==24
          print('PASS_V178_AGGREGATE_ONLY_NO_CUSTOMER_DATA_NO_AUTOAPPROVAL')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v178-synthetic-ocr-aggregate-only
          path: |
            v178-synthetic-ocr-report.json
            v178-ocr-tests.xml
          retention-days: 3
          if-no-files-found: ignore
