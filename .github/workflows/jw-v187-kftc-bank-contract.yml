name: JW V18.7 KFTC read-only banking response fail-closed contract (review only)
on:
  push:
    branches:
      - review/v187-kftc-bank-page-contract-20261031
permissions:
  contents: read
concurrency:
  group: jw-v187-bank-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kftc-bank-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      JW_ENV: review
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing project regression dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile and execute 38 strict provider shape/corruption tests
        run: |
          python -m py_compile scripts/review/kftc_bank_page_v187.py
          python -m pytest -q tests/test_v187_kftc_bank_page.py -ra --junitxml=v187-kftc.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases=list(ET.parse("v187-kftc.xml").getroot().iter("testcase"))
          assert len(cases)==38,len(cases)
          assert not any(c.find(x) is not None for c in cases for x in ("failure","error","skipped"))
          print("PASS_V187_38_STRICT_BANK_RESPONSE_TESTS_NO_REAL_BANK_CALL")
          PY
      - name: Prove no settlement authority or production bank connector
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/review/kftc_bank_page_v187.py')
          s=p.read_text()
          assert 'bank_reconciliation_verified: bool=False' in s
          assert 'financial_settlement_verified: bool=False' in s
          assert 'corporate_account_authorized: bool=False' in s
          assert 'httpx' not in s and 'psycopg' not in s
          print('PASS_V187_NO_BANK_NETWORK_CREDENTIALS_OR_SETTLEMENT_CLAIMS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v187-bank-offline-contract-tests
          path: v187-kftc.xml
          retention-days: 3
          if-no-files-found: ignore
