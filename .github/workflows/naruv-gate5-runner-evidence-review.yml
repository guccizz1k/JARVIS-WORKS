name: NARUV Gate 5 runner evidence review
on:
  pull_request:
    branches: [review/naruv-gate5-signed-pg17-20261127]
    paths:
      - 'scripts/p1_external_custodian_pg17_v223.py'
      - 'scripts/naruv_runner_evidence_review.py'
      - 'tests/test_naruv_runner_evidence_review.py'
      - 'tests/test_p1_external_custodian_pg17_integration_v223.py'
      - '.github/workflows/naruv-gate5-runner-evidence-review.yml'
permissions:
  contents: read
jobs:
  runner-evidence:
    if: github.repository == 'guccizz1k/JARVIS-WORKS'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NARUV_RUNNER_EVIDENCE_CI: '1'
      NARUV_EXPECTED_RUNNER_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact source pin
        run: test "$(git rev-parse HEAD)" = "$NARUV_EXPECTED_RUNNER_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest>=8,<10' 'cryptography>=43,<47' 'psycopg[binary]>=3.2,<4'
      - name: Compile and exercise fail-closed capture
        run: |
          python -m py_compile scripts/p1_external_custodian_pg17_v223.py scripts/naruv_runner_evidence_review.py tests/test_naruv_runner_evidence_review.py tests/test_p1_external_custodian_pg17_integration_v223.py
          python -m pytest --noconftest -q tests/test_naruv_runner_evidence_review.py tests/test_p1_external_custodian_pg17_v223.py
      - name: Start synthetic source only
        run: |
          set -euo pipefail
          docker run --rm -d --name jw-p1-source --network none --tmpfs /var/lib/postgresql/data:rw,size=1073741824 -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          for i in $(seq 1 60); do
            if docker exec jw-p1-source sh -c 'test "$(cat /proc/1/comm)" = postgres && pg_isready -q -U postgres'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Actual synthetic 22 archive restores with bound evidence
        run: python -m pytest --noconftest -q -v tests/test_p1_external_custodian_pg17_integration_v223.py -k future_archive_observation_pg17
      - name: Verify source and restore containers removed
        if: always()
        run: |
          set -euo pipefail
          if docker inspect jw-p1-source >/dev/null 2>&1; then docker rm -f jw-p1-source; fi
          test -z "$(docker ps -a --filter name=jw-p1-external-pg17- --format '{{.ID}}')"
          test -z "$(docker ps -a --filter name=jw-p1-source --format '{{.ID}}')"
