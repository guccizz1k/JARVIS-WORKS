name: JW V16.4 strict stage catalog and scoped privilege preflight
on:
  push:
    branches:
      - review/v164-stage-real-pg-catalog-40-20261031
permissions:
  contents: read
concurrency:
  group: jw-v164-stage-static-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  stage40-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict review source protection
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code b8313109a623c2cf86af86d36ae42bf8f95e7574 HEAD -- app/ app/static/ migrations/ security/ requirements.txt
          grep -q 'return False, label + "_REVIEW_LEDGER_FORCED_RLS"' scripts/jw_v135_stage_connection_probe.py
          grep -q 'return False, label + "_REVIEW_DIRECT_WRITE_GRANT"' scripts/jw_v135_stage_connection_probe.py
      - name: Install isolated test dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt
          python -m pip install 'fastapi==0.128.2' 'starlette==0.50.0' 'anyio==4.13.0' 'httpx==0.28.1' 'pytest==9.0.2' 'pytest-asyncio==1.3.0'
      - name: Compile candidate
        run: python -m compileall -q scripts app
      - name: Stage preflight independent negative tests, fail on warning/skip
        env:
          PYTHONWARNINGS: error
        run: |
          python -m pytest -q -ra -o asyncio_default_fixture_loop_scope=function --junitxml=v164-stage-test.xml tests/test_jw_v135_stage_connection_probe.py
      - name: Validate JUnit independently
        run: |
          python - <<'PY'
          from xml.etree import ElementTree as ET
          root=ET.parse('v164-stage-test.xml').getroot()
          s=root.find('testsuite') if root.tag=='testsuites' else root
          n={k:int(s.attrib.get(k,0)) for k in ('tests','errors','failures','skipped')}
          assert n['tests']>=17 and n['errors']==n['failures']==n['skipped']==0,n
          print('PASS_V164_STAGE_ROLE_RLS_TESTS',n)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v164-stage-junit
          path: v164-stage-test.xml
          retention-days: 1
          if-no-files-found: ignore
