name: JW V9.3 Supabase TLS discovery and PG quote read evidence
on:
  push:
    branches:
      - review/v93-supabase-https-pg-read-recovery-20261025
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jw-v93-tls-read-review
  cancel-in-progress: true
jobs:
  safe-supabase-tls-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed TLS/hostname contract
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt
          python -m pytest -q tests/test_ci_v93_supabase_tls_probe.py tests/test_pg_quote_read_v93.py tests/test_ci_v93_finance_restore.py -ra --junitxml=v93-guard.xml
      - name: Passwordless read-only actual dev Supabase Postgres TLS SSLRequest
        run: |
          python -m scripts.ci_v93_supabase_tls_probe | tee v93-supabase-tls.json
          python - <<'PY'
          import json
          j=json.load(open("v93-supabase-tls.json"))
          assert j["authenticated"] is False and j["deployed_https"] is False
          assert j["production_cutover"] is False
          if j["tls"]!="VERIFIED_CA_AND_HOSTNAME":
              print("BLOCKED: actual Supabase CA/hostname or connectivity is NOT verified")
          else:
              print("PASS: actual Supabase PG17 public TLS certificate/hostname verified WITHOUT login")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v93-supabase-tls-discovery
          path: |
            v93-guard.xml
            v93-supabase-tls.json
          retention-days: 3
          if-no-files-found: ignore
