name: JW V21.0 actual infinity-glass workspace UI acceptance
on:
  push:
    branches:
      - review/v210-infinity-workspace-20261102
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jw-v210-infinity-ui
  cancel-in-progress: true
jobs:
  real-chromium-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    env:
      JW_ENV: review
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate 1 3 immutable business code and exact additive assets
        run: |
          node --check app/static/premium_v210.js
          python -m py_compile scripts/ci_v210_reference_browser.py
          python - <<'PY'
          import subprocess
          from pathlib import Path
          original='bc4029e231765c24669757aad3ece774b40c6f16'
          changed=set(subprocess.check_output(['git','diff','--name-only',original,'HEAD'],text=True).splitlines())
          allowed={'app/static/index.html','app/static/premium_v210.css',
                   'app/static/premium_v210.js','app/static/jw210_infinity.svg',
                   'scripts/ci_v210_reference_browser.py','.github/workflows/jw-v210-infinity-ui.yml'}
          assert changed==allowed,(changed-allowed,allowed-changed)
          assert not any(p.startswith(("db/","migrations/")) or p.startswith("app/") and not p.startswith("app/static/") for p in changed)
          html=Path('app/static/index.html').read_text()
          assert html.index('premium_v209.css')<html.index('premium_v210.css')
          assert html.index('premium_v209.js')<html.index('premium_v210.js')
          assert html.index('data-page="imports"')<html.index('data-page="dashboard"')
          print("PASS: protected business logic, auth and DB unchanged")
          PY
      - name: Browser dependencies
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Gate 2 4 5 animation keyboard search routing geometry full-browser
        run: python -m scripts.ci_v210_reference_browser
      - name: Upload real browser screens and recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jw-v210-real-browser-evidence
          path: artifacts/v210-verified-browser/
          if-no-files-found: ignore
          retention-days: 7
