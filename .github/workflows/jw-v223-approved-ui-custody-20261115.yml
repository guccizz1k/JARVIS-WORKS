name: V22.3 approved UI original custody (review-only)
on:
  push:
    branches:
      - review/jw-v223-owner-approved-source-20261115
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolate protected parent and forbid UI mutation
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = review/jw-v223-owner-approved-source-20261115
          git merge-base --is-ancestor 352537219d0e7ecc40392fc52741668fa8fb45b2 HEAD
          test "$(git hash-object app/main.py)" = 775f500c8a7549d434ce196a8e0763aea33e1c67
          test "$(git hash-object app/static/approved_v223_owner_original.html)" = a1712541b46167c21e9779d41bb198745df2ffc0
          python - <<'PY'
          import subprocess
          previous='352537219d0e7ecc40392fc52741668fa8fb45b2'
          actual=set(subprocess.check_output(['git','diff','--name-only',previous,'HEAD'],text=True).splitlines())
          expected={'app/static/approved_v223_owner_original.html','docs/review/jw-v223-owner-approved-ui-immutable-20261115.md','tests/test_v223_owner_approved_ui_pin.py','.github/workflows/jw-v223-approved-ui-custody-20261115.yml'}
          assert actual==expected,(actual,expected)
          print('PASS_APPROVED_SOURCE_TREE_ONLY_NO_MAIN_NO_DB_NO_DEPLOY')
          PY
      - name: Verify exact original bytes and JavaScript grammar
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m pytest -q -p no:cacheprovider --noconftest tests/test_v223_owner_approved_ui_pin.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app/static/approved_v223_owner_original.html').read_text('utf8')
          assert s.count('<script>')==1
          Path('/tmp/jw-approved-ui-inline.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0],'utf8')
          PY
          node --check /tmp/jw-approved-ui-inline.js
      - name: Mandatory scope
        run: echo 'PROVENANCE_ONLY. Original local business logic not server-integrated. Never call this P2/P3/P4 release PASS.'
