name: JW V21.2 user source glass real browser review
on:
  push:
    branches:
      - review/v212-user-scene-glass-20261102
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jw-v212-user-source-glass
  cancel-in-progress: true
jobs:
  browser-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      JW_ENV: review
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate 1 and 3 — source-scope, syntax and no backend/DB changes
        run: |
          set -euo pipefail
          node --check app/static/premium_v212.js
          python -m py_compile scripts/ci_v212_source_glass_browser.py
          python - <<'PY'
          from pathlib import Path
          import subprocess
          changes=set(subprocess.check_output(['git','diff','--name-only',
            '17ad70b1469ea8716843e5e8a8e4b1453c434dfc','HEAD'],text=True).splitlines())
          required={
            'app/static/index.html','app/static/premium_v212.js',
            'app/static/premium_v212.css',
            'scripts/ci_v212_source_glass_browser.py',
            '.github/workflows/jw-v212-source-glass-ui.yml',
          }
          assert changes==required,(changes,required)
          html=Path('app/static/index.html').read_text()
          assert html.index('premium_v211.css')<html.index('premium_v212.css')
          assert html.index('premium_v211.js')<html.index('premium_v212.js')
          for input_name in ('email','password','otp','recovery_code'):
            assert 'name="'+input_name+'"' in html,input_name
          code=Path('app/static/premium_v212.js').read_text()
          for banned in ('fetch(', 'XMLHttpRequest', 'localStorage', 'sessionStorage', 'eval(', 'innerHTML'):
            assert banned not in code,banned
          assert code.count('function createSculpture(host)')==1
          assert 'const N=1040' in code
          assert 'const PERIOD=9000' in code
          assert 'JW_PREMIUM_V212' in code
          print('PASS: exact-scope UI only, existing authentication and backend unchanged')
          PY
      - name: Install isolated Chromium browser test dependencies
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Gate 2/4/5 — real browser user-source sculpture and existing B2B tools
        run: python -m scripts.ci_v212_source_glass_browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v212-real-browser-artifacts
          path: artifacts/v212-browser/
          retention-days: 7
          if-no-files-found: ignore
