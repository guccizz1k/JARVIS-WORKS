name: V22.3 isolated Render real browser 3 viewport 17 route E2E
on:
  push:
    branches: [review/jw-v223-p2-live-browser-e2e-20261115]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  real-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify review source, original UI provenance, and QA-only changes
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c1e08f6718867cf522e50596971c33761e583796 HEAD
          test "$(git hash-object app/main.py)" = 775f500c8a7549d434ce196a8e0763aea33e1c67
          test "$(git hash-object app/static/approved_v223_owner_original.html)" = a1712541b46167c21e9779d41bb198745df2ffc0
          python - <<'PY'
          import subprocess
          actual=set(subprocess.check_output(['git','diff','--name-only','c1e08f6718867cf522e50596971c33761e583796','HEAD'],text=True).splitlines())
          expected={'scripts/ci_v223_live_browser_qa.py','.github/workflows/jw-v223-real-browser-qa-20261115.yml'}
          assert actual==expected,(actual,expected)
          PY
      - name: Install Chromium browser for deterministic real HTTPS UI E2E
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: 17 real live UI routes, actual login, cross viewport and logout
        run: |
          set -euo pipefail
          python scripts/ci_v223_live_browser_qa.py
      - name: Store actual screenshots and QA results, including on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jw-v223-real-render-chromium-screenshots
          path: artifacts/real-browser/
          if-no-files-found: ignore
          retention-days: 3
      - name: Explicitly narrow proof
        run: echo "Real Chromium and synthetic staging only. NOT iPhone Safari or production PG17 proof."
