name: JW V22.3 S4 immutable reviewed snapshot integrity
on:
  push:
    branches:
      - review/jw-v223-s4-snapshot-guard-20261114
    paths:
      - app/pg_cinema_s4_reconciliation_v1.py
      - tests/test_cinema_pg_s4_snapshot_integrity_20261114.py
      - tests/test_cinema_pg_s4_reconciliation.py
      - .github/workflows/jw-v223-s4-snapshot-integrity-20261114.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jw-s4-readonly-snapshot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pure-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact review candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile production S4 module and regression
        run: |
          python -m py_compile app/pg_cinema_s4_reconciliation_v1.py tests/test_cinema_pg_s4_snapshot_integrity_20261114.py
      - name: Install isolated test runner
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10'
      - name: Run existing S4 regression alongside 12 new immutable-snapshot checks
        run: |
          python -m pytest -q -ra -p no:cacheprovider --noconftest --junitxml=s4-junit.xml tests/test_cinema_pg_s4_reconciliation.py tests/test_cinema_pg_s4_snapshot_integrity_20261114.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('s4-junit.xml').getroot()
          suites=[root] if root.tag=='testsuite' else root.findall('.//testsuite')
          totals={k:sum(int(s.get(k,'0')) for s in suites) for k in ('tests','errors','failures','skipped')}
          assert totals['tests'] >= 12 and all(totals[k]==0 for k in ('errors','failures','skipped')), totals
          print('S4_EXISTING_AND_SNAPSHOT_REGRESSION_PASS:', totals['tests'])
          PY
