name: JW V9.5 Supavisor connectivity check
on:
  push:
    branches:
      - review/v95-supavisor-session-tls-20261025
permissions:
  contents: read
jobs:
  verify-session-tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt
          python -m pytest -q tests/test_ci_v95_supavisor_session_tls.py tests/test_ci_v94_supabase_ipv6_preflight.py tests/test_ci_v93_supabase_tls_probe.py -ra
      - run: python -m scripts.ci_v95_supavisor_session_tls
