name: JW V22.2 root UI candidate (JW_ROOT_UI=v222, isolated synthetic only)
# Candidate-only validation. It never deploys, never touches Supabase/Render/production data,
# and cannot change the default root (CINEMA). Synthetic SQLite only: this is NOT Gate 2/3/4.
on:
  push:
    branches:
      - candidate/jw-v222-root-ui-20261106
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jw-cinema-pg-v222-root
  cancel-in-progress: true
jobs:
  guard-and-pure:
    name: "Containment guard + root selector unit tests (no browser, no database)"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Containment guard (protected CINEMA/main/static hashes, whitelist, no deleted tests, no new skips)
        run: python3 -I scripts/ci_cinema_pg_guard.py
      - name: Root selector tests and the protected CINEMA entry tests
        run: |
          python -m pip install pytest
          python -I -m pytest -q -p no:cacheprovider --noconftest -ra --junitxml=jw-cinema-pg-v222-root-pure.xml \
            tests/test_cinema_pg_root_ui_switch.py tests/test_cinema_pg_entry_load.py tests/test_cinema_pg_guard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-cinema-v222-root-pure
          path: jw-cinema-pg-v222-root-pure.xml
          retention-days: 3

  real-chromium-root:
    name: "Real Chromium on / (V22.2): login, motion, rail, documents, reduced-motion, perf, MP4"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JW_ENV: review
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned project requirements and isolated browser validation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fonts-nanum ffmpeg
          python3 -m pip install -r requirements.txt 'pytest>=8,<10' 'pytest-asyncio>=0.24,<2' 'httpx>=0.27,<1' 'psycopg[binary]>=3,<4' 'playwright>=1.50,<2' 'PyMuPDF>=1.25,<2' 'reportlab>=4,<5' 'pillow>=10'
          python3 -m playwright install --with-deps chromium
          test -f /usr/share/fonts/truetype/nanum/NanumGothic.ttf
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Preserve original CINEMA, main, static content
        run: python3 -I scripts/ci_cinema_pg_guard.py
      - name: Regression - the protected default root (CINEMA) and /_legacy-ui are unchanged
        run: python3 -m scripts.ci_cinema_pg_browser_entrypoints
      - name: V22.2 root acceptance (actual / entry path, real login, MP4)
        run: python3 -m scripts.ci_cinema_pg_v222_root_browser
      # The two historical V22.2 suites are reused UNCHANGED: they were written against the
      # index.html DOM, which is exactly what / serves when JW_ROOT_UI=v222 (isolated_server
      # forwards the environment). No test was rewritten and no selector was edited.
      - name: Existing V22.2 cinematic suite, now against the real / (unchanged script)
        if: always()
        env:
          JW_ROOT_UI: v222
        run: python3 -m scripts.ci_v222_cinematic_browser
      - name: Existing V22.3 real-browser recording, now against the real / (unchanged script)
        if: always()
        env:
          JW_ROOT_UI: v222
        run: python3 -m scripts.ci_v223_real_browser_recording
      - name: SHA-256 of every evidence file
        if: always()
        run: |
          set -euo pipefail
          cd artifacts/v222-root-browser
          find . -type f ! -path './raw-video/*' | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-cinema-v222-root-browser
          path: |
            artifacts/v222-root-browser/
            !artifacts/v222-root-browser/raw-video/
            artifacts/cinema-pg-browser/
            artifacts/v222-cinematic/
            artifacts/v223-real-ui-video/
          retention-days: 7
          if-no-files-found: warn
