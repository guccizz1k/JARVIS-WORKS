name: JW V19.9 actual DEV import-shape PG17 writer browser (review only)
on:
  push:
    branches:
      - review/v199-real-shape-import-writer-20261101
      - review/v200-dev-import-preflight-dsn-20261101
permissions:
  contents: read
concurrency:
  group: jw-v199-real-chromium-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chrome-pg17-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JW_ENV: review
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-only-ephemeral-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing PG and browser runtime dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Compile and block unexpected nonisolated source
        run: |
          python -m py_compile scripts/ci_v199_exact_shape_browser_pg17.py scripts/review/pg_import_preview_v199.py
          python - <<'PY'
          from pathlib import Path
          s=Path("scripts/ci_v199_exact_shape_browser_pg17.py").read_text()
          for x in ("fixture.disposable_root_check()","ONLY_EPHEMERAL_LOCAL_DATABASE",
             "sync_playwright()","new File([bytes]","new FormData()",
             "quote-review-previews","orders/from-reviewed-draft","invoice-preview",
             "PASS_V199_40_DIRECT_SQL_INSERT_ATTACKS_FAIL_CLOSED",
             "PASS_V199_CHROMIUM_TENANT_B_CROSS_ORG_4_ROUTE_DENIAL"):
             assert x in s,x
          for x in ("SUPABASE_DSN","JW_PG_STAGE_DSN","onrender.com","TestClient("):
             assert x not in s,x
          print("PASS_V199_ONLY_FRESH_LOCAL_PG17_BROWSER_CODE",flush=True)
          PY
      - name: V20.0 hostile DSN/role/key guard (no network)
        run: |
          python -m py_compile scripts/ci_v200_disposable_dsn_guard.py
          python -m scripts.ci_v200_disposable_dsn_guard
      - name: Real Chromium native multipart upload, human confirmation and independent SQL assertions
        run: python -m scripts.ci_v199_exact_shape_browser_pg17
