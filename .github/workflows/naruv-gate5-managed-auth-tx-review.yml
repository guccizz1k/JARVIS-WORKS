name: NARUV Gate 5 authorization transaction concurrency review
on:
  pull_request:
    branches: [review/naruv-gate5-managed-identity-20261127]
    paths:
      - 'db/review/naruv_supabase_hosted_auth_tx_rehearsal.sql'
      - 'scripts/naruv_hosted_auth_tx_concurrency_review.py'
      - '.github/workflows/naruv-gate5-managed-auth-tx-review.yml'
permissions:
  contents: read
jobs:
  auth-tx-concurrency:
    if: github.repository == 'guccizz1k/JARVIS-WORKS'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NARUV_AUTH_TX_CI: DISPOSABLE_ONLY
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact review SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.9'
      - name: Disposable PG17 SCRAM listener
        run: |
          set -euo pipefail
          docker run --rm -d --name naruv-auth-tx-ci -p 127.0.0.1:55439:5432 --tmpfs /var/lib/postgresql/data:rw,size=536870912 -e POSTGRES_PASSWORD=synthetic_review_only -e POSTGRES_HOST_AUTH_METHOD=scram-sha-256 -e POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 postgres:17
          for i in $(seq 1 45); do
            if docker exec naruv-auth-tx-ci sh -c 'test "$(cat /proc/1/comm)" = postgres && pg_isready -U postgres -q'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Actual overlapping transactions and direct login tests
        run: |
          python -m py_compile scripts/naruv_hosted_auth_tx_concurrency_review.py
          python scripts/naruv_hosted_auth_tx_concurrency_review.py
      - name: Confirm disposable DB removed
        if: always()
        run: |
          set -euo pipefail
          if docker inspect naruv-auth-tx-ci >/dev/null 2>&1; then docker rm -f naruv-auth-tx-ci; fi
          ! docker inspect naruv-auth-tx-ci >/dev/null 2>&1
