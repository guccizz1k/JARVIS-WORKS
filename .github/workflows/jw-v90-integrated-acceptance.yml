name: JARVIS V8.9 to V9.0 isolated acceptance (review only)

on:
  pull_request:
    branches:
      - review/v90-on-v89-20261024

permissions:
  contents: read

concurrency:
  group: jw-v90-review-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  restored-source-regression:
    # The only DB used is a disposable PostgreSQL 17 Docker service on the runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-only-ephemeral-test-password@127.0.0.1:5432/postgres
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact V8.9 descendant
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify historical ancestry and protected production entrypoint
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a3783ef9f7aeeeff655f1f0ac376f6d8edf5b338 HEAD
          test "$(git rev-parse a3783ef9f7aeeeff655f1f0ac376f6d8edf5b338:app/main.py)" = "$(git rev-parse HEAD:app/main.py)"
          echo "PASS: exact V8.9 parent and production entrypoint"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OCR fonts and system language packs for the 589 tests
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-nanum tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
          test -f /usr/share/fonts/truetype/nanum/NanumGothic.ttf
          tesseract --list-langs

      - name: Install all original test dependency groups
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check -r requirements-ocr-v64.txt
          python -m pip install --disable-pip-version-check -r requirements-postgres-check.txt
          # V6.4 uses legacy "import fitz" inside a strict JSON-only subprocess.
          # PyMuPDF 1.28.2 emits a stdout deprecation message, corrupting JSON.
          # Use the independently tested 1.26.7 until worker output isolation is upgraded.
          python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.7' 'reportlab==4.4.9'
          python - <<'PY'
          import subprocess, sys
          p = subprocess.run([sys.executable, '-c', 'import fitz'], capture_output=True, text=True, check=True)
          assert not p.stdout.strip(), 'BLOCKED: PDF library polluted worker stdout'
          import fitz, PIL, pytest, psycopg, reportlab
          print('PASS: PDF subprocess stdout is JSON-safe; all CI test imports available')
          PY

      - name: Prepare pinned V7.9 installer test fixture
        run: python scripts/ci_prepare_v79_overlay.py

      - name: All V8.9 + V9.0 Python regression tests
        shell: bash
        run: |
          mkdir -p artifacts
          python -m pytest -q tests --junitxml=artifacts/all-pytests.xml

      - name: Enforce nonzero, zero-skipped JUnit contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse('artifacts/all-pytests.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          counts = {key: sum(int(s.get(key, '0')) for s in suites)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          print('JUNIT', counts)
          assert counts['tests'] >= 589 and not any(
              counts[k] for k in ('failures', 'errors', 'skipped')
          ), 'full local baseline must not regress or skip'
          PY

      - name: Existing independent PostgreSQL 17 tenant and attachment adversarial gate
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m scripts.run_postgres_isolation_ci_v28
          echo "NOTE: This proves legacy V2.8 ephemeral RLS attacks, NOT V9 production RLS/concurrency."

      - name: Upload failure/success evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jw-v90-review-regression-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
