name: JW V22.3 recovered cookie and dual-home resilience QA
on:
  push:
    branches:
      - review/jw-v223-cookie-resilience-20261114
    paths:
      - app/pg_cinema_cutover_front_v223.py
      - tests/test_cinema_pg_v223_cookie_boundary.py
      - tests/test_cinema_pg_v223_fail_closed_cookie_and_merged_outage.py
      - tests/test_cinema_pg_v223_response_cookie_security.py
      - .github/workflows/jw-v223-cookie-resilience-20261114.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jw-v223-cookie-resilience-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-cookie-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact review candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated deps
        run: |
          python -m pip install --disable-pip-version-check 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'pytest>=8,<10' 'pytest-asyncio>=0.24,<2'
      - name: Compile code and restored tests
        run: |
          python -m py_compile app/pg_cinema_cutover_front_v223.py tests/test_cinema_pg_v223_cookie_boundary.py tests/test_cinema_pg_v223_fail_closed_cookie_and_merged_outage.py tests/test_cinema_pg_v223_response_cookie_security.py
      - name: Run restored historical cookie security regression; no real DB
        run: |
          python -m pytest -q -ra -p no:cacheprovider --noconftest --junitxml=cookie-resilience.xml tests/test_cinema_pg_v223_cookie_boundary.py tests/test_cinema_pg_v223_fail_closed_cookie_and_merged_outage.py tests/test_cinema_pg_v223_response_cookie_security.py
