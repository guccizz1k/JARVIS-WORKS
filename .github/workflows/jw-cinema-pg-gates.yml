name: JW CINEMA PG trade engine gates (disposable DB only)
on:
  push:
    branches:
      - review/jw-cinema-pg-engine-20261104
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jw-cinema-pg-gates
  cancel-in-progress: true
jobs:
  containment-and-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Containment guard (protected hashes, whitelist, no deleted tests, no new skips)
        run: python3 -I scripts/ci_cinema_pg_guard.py
      - name: Pure tests (new files only; no fastapi or database needed)
        run: |
          python -m pip install pytest
          python -I -m pytest -q -p no:cacheprovider --noconftest -ra --junitxml=jw-cinema-pg-static.xml \
            tests/test_cinema_pg_guard.py tests/test_cinema_pg_sql_contract.py \
            tests/test_cinema_pg_adapter_contract.py tests/test_cinema_pg_bridge_js.py \
            tests/test_cinema_pg_entry_load.py tests/test_cinema_pg_register.py \
            tests/test_cinema_pg_s4_reconciliation.py
      - name: Security regressions that import the real FastAPI adapter (error masking, ledger number fail-closed)
        run: |
          python -m pip install pytest fastapi httpx
          python -m pytest -q -p no:cacheprovider --noconftest -ra --junitxml=jw-cinema-pg-security.xml \
            tests/test_cinema_pg_security_regressions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-cinema-pg-static
          path: |
            jw-cinema-pg-static.xml
            jw-cinema-pg-security.xml
          retention-days: 3
  sql-gate-disposable-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JW_CINEMA_PG_DISPOSABLE: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only-ephemeral-test-password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Engine + tests on a throw-away database (creates and drops its own DB)
        run: python3 -I scripts/ci_cinema_pg_sql_gate.py --report jw-cinema-pg-sql-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-cinema-pg-sql-gate
          path: jw-cinema-pg-sql-gate.json
          retention-days: 3

  full-project-pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate 1 - protect unchanged CINEMA and backend entrypoint
        run: |
          set -euo pipefail
          python3 -I scripts/ci_cinema_pg_guard.py
          test "$(git hash-object app/static/cinema/JARVIS_WORKS_CINEMA.html)" = "9bedf97fe718a94f07861e23670685af00619ca8"
          test "$(git hash-object app/main.py)" = "775f500c8a7549d434ce196a8e0763aea33e1c67"
      - name: Install only declared test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt 'PyMuPDF>=1.24,<2' 'reportlab>=4,<5'
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tesseract-ocr tesseract-ocr-kor fonts-nanum
          test -f /usr/share/fonts/truetype/nanum/NanumGothic.ttf
          tesseract --list-langs | grep -Eq '(^|[[:space:]])kor($|[[:space:]])'
      - name: Reconstruct historical V7.9 fixture from SHA-pinned archive (no source edits)
        run: python3 -I scripts/ci_cinema_pg_legacy_fixture_v1.py
      - name: Gate 2-5 - whole current test suite (no skips accepted)
        run: |
          set -euo pipefail
          mkdir -p artifacts/cinema-pg-full
          python3 -m pytest -q -ra -p no:cacheprovider --junitxml=artifacts/cinema-pg-full/all-tests.xml tests
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse("artifacts/cinema-pg-full/all-tests.xml").getroot()
          items=[root] if root.tag=="testsuite" else root.findall(".//testsuite")
          result={k:sum(int(x.attrib.get(k,0)) for x in items) for k in ("tests","errors","failures","skipped")}
          if not items or result["tests"]<169 or any(result[k] for k in ("errors","failures","skipped")):
              raise SystemExit("BLOCKED_FULL_REGRESSION "+str(result))
          print("PASS_FULL_PROJECT_PYTEST",result)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-cinema-pg-full-pytest
          path: artifacts/cinema-pg-full/all-tests.xml
          retention-days: 3

  baseline-vs-candidate-legacy:
    name: "Differential: fix 11 historical fixtures without reducing checks"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only existing test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt
      - name: Reconstruct approved historical fixtures only on candidate
        run: python3 -I scripts/ci_cinema_pg_legacy_fixture_v1.py
      - name: Baseline failing tests must become real PASS (no skips)
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/jw-original-baseline" 08ea29867e962d4ac5be0e942fc1488528494428
          python3 - <<'PY'
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path.cwd()
          baseline=Path(os.environ['RUNNER_TEMP'])/'jw-original-baseline'
          cases=[
              'tests/test_installer_v75.py',
              'tests/test_installer_v79.py',
              'tests/test_pg_auth_v85.py::test_no_legacy_main_mutation',
          ]
          outcomes={}
          for name,folder in (('baseline',baseline),('candidate',root)):
              xml=Path(os.environ['RUNNER_TEMP'])/(name+'-legacy.xml')
              cmd=['python3','-m','pytest','-q','-p','no:cacheprovider',f'--junitxml={xml}',*cases]
              p=subprocess.run(cmd,cwd=folder,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=240)
              if not xml.is_file():
                  raise SystemExit('BLOCKED_'+name.upper()+'_XML_MISSING')
              tree=ET.parse(xml)
              testnodes=tree.findall('.//testcase')
              entries={}
              for t in testnodes:
                  key=t.attrib.get('classname','')+'::'+t.attrib.get('name','')
                  entries[key]='ERROR' if t.find('error') is not None else 'FAIL' if t.find('failure') is not None else 'SKIP' if t.find('skipped') is not None else 'PASS'
              outcomes[name]=entries
              print(name,{'exit':p.returncode,'total':len(entries),'fails':sum(v=='FAIL' for v in entries.values()),'errors':sum(v=='ERROR' for v in entries.values()),'skips':sum(v=='SKIP' for v in entries.values())},flush=True)
              print('tail:',p.stdout[-1200:],flush=True)
          old=outcomes['baseline']
          new=outcomes['candidate']
          if set(old)!=set(new) or len(old)!=12:
              raise SystemExit('TEST_INVENTORY_CHANGED')
          old_fail={k for k,v in old.items() if v=='FAIL'}
          if len(old_fail)!=11 or any(v not in ('PASS','FAIL') for v in old.values()):
              raise SystemExit('UNEXPECTED_HISTORICAL_FAILURES '+str(old))
          if any(v!='PASS' for v in new.values()):
              raise SystemExit('HISTORICAL_FIXTURE_REPAIR_NOT_PROVEN '+str(new))
          if sum(old[k]=='FAIL' and new[k]=='PASS' for k in old)!=11:
              raise SystemExit('REPAIR_DELTA_INVALID')
          print('PASS_DIFFERENTIAL_REPAIRED_11_REAL_LEGACY_TESTS; no tests deleted/skipped',flush=True)
          PY

  s4-atomic-two-writers-pg17:
    name: "S4 atomic ledger claims: PG17 SQL + real concurrent writers"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JW_CINEMA_PG_DISPOSABLE: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only-ephemeral-test-password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject shared DBs; test both-ways duplicate claims with real PG17 transactions
        run: |
          set -euo pipefail
          python3 -I scripts/ci_cinema_pg_s4_atomic_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-cinema-s4-atomic-pg17
          path: jw-cinema-s4-atomic-pg17.json
          retention-days: 3

  real-desktop-browser-prelaunch:
    name: "Real Chromium PC login, premium UI and synthetic document acceptance"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      JW_ENV: review
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned project requirements and isolated browser validation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fonts-nanum tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
          python3 -m pip install -r requirements.txt 'pytest>=8,<10' 'pytest-asyncio>=0.24,<2' 'httpx>=0.27,<1' 'psycopg[binary]>=3,<4' 'playwright>=1.50,<2' 'PyMuPDF>=1.25,<2' 'reportlab>=4,<5'
          python3 -m playwright install --with-deps chromium
          test -f /usr/share/fonts/truetype/nanum/NanumGothic.ttf
      - name: Preserve original CINEMA, main, static content
        run: python3 -I scripts/ci_cinema_pg_guard.py
      - name: Gate 4 real CINEMA root and original protected PC login /_legacy-ui
        run: |
          set -euo pipefail
          python3 -m scripts.ci_cinema_pg_browser_entrypoints
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-cinema-real-desktop-browser-prelaunch
          path: |
            artifacts/cinema-pg-browser/
            artifacts/v214-desktop/
            artifacts/v216-browser/
            artifacts/v217-browser/
            artifacts/v218-browser/
            artifacts/v219-source-compare/
          retention-days: 3
          if-no-files-found: warn
