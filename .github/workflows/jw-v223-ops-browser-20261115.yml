name: V22.3 Chromium+WebKit 9 operational panels real Render QA
on:
  push:
    branches: [review/jw-v223-p2-real-ops-browser-20261115]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  actual-browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Only QA code changes; exact approved UI remains intact
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5711acaa9203341dbd190f30efd9ed7009bca4f5 HEAD
          test "$(git hash-object app/static/approved_v223_owner_original.html)" = a1712541b46167c21e9779d41bb198745df2ffc0
          test "$(git hash-object app/main.py)" = 775f500c8a7549d434ce196a8e0763aea33e1c67
          python - <<'PY'
          import subprocess
          diff=set(subprocess.check_output(['git','diff','--name-only','5711acaa9203341dbd190f30efd9ed7009bca4f5','HEAD'],text=True).splitlines())
          assert diff=={'scripts/ci_v223_real_operational_browser.py','.github/workflows/jw-v223-ops-browser-20261115.yml'},diff
          PY
      - name: Install real engines
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.58.0'
          python -m playwright install --with-deps chromium webkit
      - name: Four browser cases, nine server panels, 17 menu navigation
        run: |
          set -euo pipefail
          python scripts/ci_v223_real_operational_browser.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jw-v223-real-ops-ui-images
          path: artifacts/jw-v223-operational-browser/
          if-no-files-found: ignore
          retention-days: 3
      - run: echo "Synthetic staging only; Linux WebKit not real iPhone and all launch blockers remain evidence gated."
