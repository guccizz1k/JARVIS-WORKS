name: NARUV wave14 actual PG17 adjustment and modern CVD verification
on:
  pull_request:
    branches: [review/naruv-wave13-ci-repair-20261128]
    paths: ['.github/workflows/naruv-wave14-integrated-review.yml']
permissions:
  contents: read
jobs:
  integrated:
    if: github.repository == 'guccizz1k/JARVIS-WORKS' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      JW_ENV: review
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-only-ephemeral-test-password@127.0.0.1:5432/postgres
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: review
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 386077c311f23d313f60678d3e23692b0e070fbf
          path: source
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 61adef8e3c4baeb9cfb2b1969cea712a14e68749
          path: wave5
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Scoped dependencies and actual Korean OCR engine
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo systemctl mask --runtime clamav-freshclam.service
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng fonts-nanum libseccomp2 clamav clamav-freshclam libclamav-dev
          /usr/bin/clamscan --version
          /usr/bin/tesseract --version
          /usr/bin/tesseract --list-langs
          test -f /usr/share/fonts/truetype/nanum/NanumGothic.ttf
          cd source
          python -m pip install -r requirements-dev.txt -r requirements-pg-stage.txt openpyxl==3.1.5 reportlab==4.4.9 pytest==9.2.0 pytest-asyncio==1.5.0 fastapi==0.165.0 starlette==1.10.0 httpx2==2.16.2 cryptography==50.0.2 pdfplumber==0.11.11 pdfminer.six==20260107 pypdfium2==5.15.2 pillow==13.0.0
          python -m pip check
      - name: Verify exact sources and build only the new C helper
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo CI_HEAD_BINDING_INVALID; exit 1; }
          test "$(git -C review rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C review rev-parse HEAD^)" = 423af41d1b6c738f572aea2cc3149e31c3b1e911
          test "$(git -C source rev-parse HEAD)" = 386077c311f23d313f60678d3e23692b0e070fbf
          test "$(git -C wave5 rev-parse HEAD)" = 61adef8e3c4baeb9cfb2b1969cea712a14e68749
          q="$PWD/review/docs/review/wave14-integrated"
          while read -r expected file; do
            test "$(git hash-object "$q/$file")" = "$expected" || { echo "WAVE14_BLOB_PIN_MISMATCH: $file"; exit 1; }
          done <<'PINS'
          56d0d1dcc1b7c54ebaba0b00194f1a4318ff6a23 postconfirm_adjustment.py
          1dd2ce97e5cd0e1b6acfe12d351050cc4f3c3cb7 postconfirm_adjustment_ci.sql
          74a38510a813139c1dfcb285088810d172d9f3e7 adjustment_view.py
          b506a9af3f65fdb795679df9349054cb371bb34f cvd_diagnostics.py
          1685ecf37aae0c0d4f7ad063d082214147aeb2a6 cvd_pair_snapshot.py
          73e260bbfbfca35b2474987dc76baa8aea189537 strict_scan_adapter.py
          5c57461060e5e8ca90fec1055d3959f32d8c2b63 strict_scan_worker.py
          0a7310c1b8670e74fe41674e0dc6f2aff9ab926a verify_cvd.c
          1479febbce3f1bc6ce31f1cdef64b109f8e50cfe independent_receipts.py
          1588e45a104772ecf996363678d664a4ca55b1e8 provider_metrics.py
          c34026c730273c45358264f23f1ce00125f79e71 hosted_evidence.py
          36775793baa6e327aa61e0709998d5087a0fde9f network_fence.py
          f8269006f5ac3c213d727be08addbed75638fde1 payroll_correction.py
          8c7e3abf08785e9ec3f323db0a4eaac4a422c038 release_evidence.py
          293217dffcf17bffd2ca26ecec8922edf6a391bd review_gates.py
          64c14e150a56de34ec032ea6bb1e0f3409aa3821 test_wave14_real.py
          574ea277eb2360fd3bd227e8214e04099ce499ff official_strict_ci.py
          PINS
          echo WAVE14_EXACT_17_BLOBS_PASS
          # All Wave11/12/13 fixtures are unchanged from the exact parent.
          git -C review diff --exit-code HEAD^ HEAD -- docs/review/wave11-integrated docs/review/wave12-integrated docs/review/wave13-integrated
          (cd source && python scripts/naruv_v223_source_custody.py)
          c="$RUNNER_TEMP/wave14-overlay"
          test "$(git hash-object wave5/docs/review/p0-p3-wave5/build.py)" = 328cea10578cec4a38a36c7fede355bb4d79c8d6
          python wave5/docs/review/p0-p3-wave5/build.py wave5/docs/review/p0-p3-wave2 "$c"
          test "$(sha256sum "$c/payroll-statement-candidate.py" | cut -d' ' -f1)" = 723641e7c655866ca04fbd5c72fbf33de1ba1fb0328d338bbe4f90b23c40a164
          cc -std=c11 -Wall -Wextra -Werror "$q/verify_cvd.c" -o "$RUNNER_TEMP/verify_cvd" -lclamav
          chmod 700 "$RUNNER_TEMP/verify_cvd"
          echo WAVE14_MODERN_C_HELPER_BUILD_PASS
      - name: Actual PG17 postconfirmation proposal and signed evidence
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          q="$PWD/review/docs/review/wave14-integrated"
          p="$PWD/review/docs/review/wave11-integrated"
          v="$PWD/review/docs/review/wave12-integrated"
          c="$RUNNER_TEMP/wave14-overlay"
          export WAVE2_DIR="$PWD/wave5/docs/review/p0-p3-wave2"
          restore() {
            git -C source restore --source=HEAD -- app/naruv_kr_payroll_review.py
            git -C source diff --exit-code
          }
          trap restore EXIT
          cp "$c/payroll-statement-candidate.py" source/app/naruv_kr_payroll_review.py
          (
            cd source
            export PYTHONPATH="$q:$p:$v:$PWD"
            python -m py_compile "$q/"*.py app/naruv_kr_payroll_review.py
            python -m pytest -q -s --strict-markers -o asyncio_default_fixture_loop_scope=function -W error::pytest.PytestDeprecationWarning -W error::starlette.exceptions.StarletteDeprecationWarning "$q/test_wave14_real.py" --junitxml="$RUNNER_TEMP/wave14.xml"
            python - "$RUNNER_TEMP/wave14.xml" <<'PY'
          import sys,xml.etree.ElementTree as E
          s=E.parse(sys.argv[1]).getroot().find('testsuite')
          assert s is not None and s.attrib['tests']=='3' and all(s.attrib[k]=='0' for k in ('failures','errors','skipped')),s.attrib
          print('WAVE14_THREE_NEW_INTEGRATION_CASES_PASS')
          PY
          )
          restore
          trap - EXIT
          (cd source && python scripts/naruv_v223_source_custody.py)
          echo WAVE14_FOCUSED_INTEGRATION_PASS
      - name: Actual strict helper and one official CVD acquisition
        run: |
          set -euo pipefail
          q="$PWD/review/docs/review/wave14-integrated"
          set +e
          timeout --kill-after=5s 160s python "$q/official_strict_ci.py" "$RUNNER_TEMP/verify_cvd"
          rc=$?
          set -e
          if [ "$rc" = 124 ] || [ "$rc" = 137 ]; then
            echo WAVE14_OFFICIAL_BLOCKED_DEADLINE
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
