name: NARUV wave15 PG17 independent review boundary and authenticated API
on:
  pull_request:
    branches: [review/naruv-wave14-integrated-20261128]
    paths: ['.github/workflows/naruv-wave15-integrated-review.yml']
permissions:
  contents: read
jobs:
  integrated:
    if: github.repository == 'guccizz1k/JARVIS-WORKS' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      JW_ENV: review
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-only-ephemeral-test-password@127.0.0.1:5432/postgres
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: review
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 386077c311f23d313f60678d3e23692b0e070fbf
          path: source
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 61adef8e3c4baeb9cfb2b1969cea712a14e68749
          path: wave5
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Scoped dependencies and actual Korean OCR engine
        run: |
          set -euo pipefail
          cd source
          python -m pip install -r requirements-dev.txt -r requirements-pg-stage.txt openpyxl==3.1.5 reportlab==4.4.9 pytest==9.2.0 pytest-asyncio==1.5.0 fastapi==0.165.0 starlette==1.10.0 httpx2==2.16.2 cryptography==50.0.2 pdfplumber==0.11.11 pdfminer.six==20260107 pypdfium2==5.15.2 pillow==13.0.0
          python -m pip check
      - name: Exact pins and prior source isolation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo CI_HEAD_BINDING_INVALID; exit 1; }
          test "$(git -C review rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C review rev-parse HEAD^)" = eb904f1c165a1a0420034e853c3fb345e90e945a
          test "$(git -C source rev-parse HEAD)" = 386077c311f23d313f60678d3e23692b0e070fbf
          test "$(git -C wave5 rev-parse HEAD)" = 61adef8e3c4baeb9cfb2b1969cea712a14e68749
          q="$PWD/review/docs/review/wave15-integrated"
          while read -r expected file; do
            test "$(git hash-object "$q/$file")" = "$expected" || { echo "WAVE15_BLOB_PIN_MISMATCH: $file"; exit 1; }
          done <<'PINS'
          578dcab60b9f79e50a95a1a36f9c4e32530d16b2 adjustment_api.py
          75a50e113d802e9bc6f4a8f949897d5acb71bc20 correction_approval.py
          2343b149c668d3b37a9722cb943794a8584c50c4 scanner_readiness.py
          46f26ef0f28103b01d0febd74781ee0340535faf hosted_preflight.py
          db63bc6a52ce15dec0a69187927fd916b273110e approval_boundary_ci.sql
          703cfa79d93f9715d7f5ae4f8932fdbf73a5c601 reviewer_issuer.py
          28b597f2f879d9031be8e06cc26c744b7123faac test_wave15_real.py
          PINS
          echo WAVE15_EXACT_7_BLOBS_PASS
          git -C review diff --exit-code HEAD^ HEAD -- docs/review/wave11-integrated docs/review/wave12-integrated docs/review/wave13-integrated docs/review/wave14-integrated
          (cd source && python scripts/naruv_v223_source_custody.py)
          c="$RUNNER_TEMP/wave15-overlay"
          test "$(git hash-object wave5/docs/review/p0-p3-wave5/build.py)" = 328cea10578cec4a38a36c7fede355bb4d79c8d6
          python wave5/docs/review/p0-p3-wave5/build.py wave5/docs/review/p0-p3-wave2 "$c"
          test "$(sha256sum "$c/payroll-statement-candidate.py" | cut -d' ' -f1)" = 723641e7c655866ca04fbd5c72fbf33de1ba1fb0328d338bbe4f90b23c40a164
      - name: Actual PG17 independent role boundary and HTTP API
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          q="$PWD/review/docs/review/wave15-integrated"
          p="$PWD/review/docs/review/wave11-integrated"
          v="$PWD/review/docs/review/wave12-integrated"
          w="$PWD/review/docs/review/wave14-integrated"
          c="$RUNNER_TEMP/wave15-overlay"
          export WAVE2_DIR="$PWD/wave5/docs/review/p0-p3-wave2"
          restore() {
            git -C source restore --source=HEAD -- app/naruv_kr_payroll_review.py
            git -C source diff --exit-code
          }
          trap restore EXIT
          cp "$c/payroll-statement-candidate.py" source/app/naruv_kr_payroll_review.py
          (
            cd source
            export PYTHONPATH="$q:$w:$p:$v:$PWD"
            python -m py_compile "$q/"*.py app/naruv_kr_payroll_review.py
            python -m pytest -q -s --strict-markers -o asyncio_default_fixture_loop_scope=function -W error::pytest.PytestDeprecationWarning -W error::starlette.exceptions.StarletteDeprecationWarning "$q/test_wave15_real.py" --junitxml="$RUNNER_TEMP/wave15.xml"
            python - "$RUNNER_TEMP/wave15.xml" <<'PY'
          import sys,xml.etree.ElementTree as E
          s=E.parse(sys.argv[1]).getroot().find('testsuite')
          assert s is not None and s.attrib['tests']=='3' and all(s.attrib[k]=='0' for k in ('failures','errors','skipped')),s.attrib
          print('WAVE15_THREE_NEW_INTEGRATION_CASES_PASS')
          PY
          )
          restore
          trap - EXIT
          (cd source && python scripts/naruv_v223_source_custody.py)
          echo WAVE15_FOCUSED_INTEGRATION_PASS
