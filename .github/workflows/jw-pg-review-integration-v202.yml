name: JARVIS WORKS isolated PG integration review V202
on:
  push:
    branches:
      - review/jw-pg-integration-20261104
permissions:
  contents: read
concurrency:
  group: jw-v202-pg-integration-review
  cancel-in-progress: true
jobs:
  protected-pg-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      JW_ENV: review
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate 1 - immutable original and compiled integration
        run: |
          set -euo pipefail
          test "$(git hash-object app/static/cinema/JARVIS_WORKS_CINEMA.html)" = "9bedf97fe718a94f07861e23670685af00619ca8"
          test "$(sha256sum app/main.py | cut -d' ' -f1)" = "91deef5315aca3edfe5b24145f5a7a79b7cc9de038eac27b91c7cf95cb95e345"
          python -m py_compile app/pg_review_integrated_v202.py tests/test_pg_review_integrated_v202.py
          node --check app/cinema_bridge_v1.js
          node --check app/cinema_bridge_v2.js
      - name: Install verified test dependencies
        run: |
          python -m pip install -r requirements.txt 'psycopg[binary]>=3,<4' pytest pytest-asyncio httpx
      - name: Gate 2-5 - restricted PostgreSQL and regression adversarial tests
        run: |
          set -euo pipefail
          mkdir -p artifacts/v202
          python -m pytest -q -ra -p no:cacheprovider \
            tests/test_pg_review_integrated_v202.py \
            tests/test_pg_api_v84.py \
            tests/test_pg_v90_integrated_entry.py \
            tests/test_pg_quote_api_v92.py \
            tests/test_pg_quote_read_v93.py \
            tests/test_pg_delivery_review_api_v154.py \
            tests/test_pg_import_quote_v160.py \
            tests/test_pg_invoice_balance_v161.py \
            tests/test_v158_trade_lineage.py \
            tests/test_pg_delivery_evidence_gate_v147.py \
            tests/test_v155_review_console_and_limits.py \
            --junitxml=artifacts/v202/v202.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('artifacts/v202/v202.xml').getroot()
          suites=[root] if root.tag=='testsuite' else root.findall('.//testsuite')
          n={k:sum(int(s.attrib.get(k,0)) for s in suites)
             for k in ('tests','failures','errors','skipped')}
          assert n['tests']>=60 and n['failures']==0 and n['errors']==0 and n['skipped']==0,n
          print('PASS PG review tests, not release signoff:',n)
          PY
      - name: Independent no-evidence final acceptance MUST remain BLOCKED
        run: |
          python - <<'PY'
          from scripts.jw_eight_stage_release_gate import report
          result=report({}, {}, sha='a'*40)
          assert result['release']=='BLOCKED'
          assert result['production_deployed'] is False
          assert result['attested_stage_count']==0
          assert len(result['stages'])==8
          assert all(x['status']!='PASS' and not x['complete'] for x in result['stages'])
          print('PASS J3 independent signoff remains BLOCKED without receipts')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v202-pg-contract-tests
          path: artifacts/v202/v202.xml
          if-no-files-found: ignore
          retention-days: 7

  messenger-pg17-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JW_ENV: review
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-only-ephemeral-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing PG17 and HTTPS dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt
      - name: Gate - real HTTPS and ephemeral PostgreSQL messenger attachment E2E
        run: |
          set -euo pipefail
          python -m py_compile scripts/ci_v190_https_pg_messenger_attachments.py
          python -m scripts.ci_v190_https_pg_messenger_attachments
  pg17-disposable-dr:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JW_ENV: review
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-only-ephemeral-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing disposable PG17 requirements
        run: python -m pip install -r requirements-postgres-check.txt
      - name: Gate - actual PG17 backup digest corruption rejection and RPO
        run: |
          set -euo pipefail
          python -m py_compile scripts/ci_v192_pg17_backup_integrity_rpo.py
          python -m scripts.ci_v192_pg17_backup_integrity_rpo
  ocr50-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      JW_ENV: review
      JW_V188_OCR_ACK: SYNTHETIC_LOCAL_KOREAN_FORMS_ONLY
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Korean OCR tools
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor fonts-nanum
      - name: Gate - actually execute 50 synthetic Korean form OCR runs
        run: |
          set -euo pipefail
          python -m py_compile scripts/ci_v188_ocr50_synthetic.py
          python -m scripts.ci_v188_ocr50_synthetic
