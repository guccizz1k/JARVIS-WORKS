name: NARUV Gate 5 isolated PG17 concurrency review
on:
  pull_request:
    branches: [review/naruv-gate5-owner-evidence-20261127]
    paths:
      - 'tests/test_naruv_gate5_pg17_concurrency_review.py'
      - '.github/workflows/naruv-gate5-pg17-concurrency-review.yml'
permissions:
  contents: read
jobs:
  disposable-pg17:
    if: github.repository == 'guccizz1k/JARVIS-WORKS'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NARUV_PG17_CONCURRENCY_CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest>=8,<10' 'psycopg[binary]>=3.2,<4'
      - name: Start disposable loopback PostgreSQL 17
        run: |
          set -euo pipefail
          docker run --rm -d --name naruv-gate5-ci -p 127.0.0.1:55439:5432 --tmpfs /var/lib/postgresql/data:rw,size=536870912 -e POSTGRES_PASSWORD=synthetic_review_only postgres:17
          for i in $(seq 1 45); do
            if docker exec naruv-gate5-ci pg_isready -U postgres -h 127.0.0.1 -q; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test actual concurrency and failure semantics
        run: |
          python -m py_compile tests/test_naruv_gate5_pg17_concurrency_review.py
          python -m pytest --noconftest -q tests/test_naruv_gate5_pg17_concurrency_review.py
      - name: Remove disposable database
        if: always()
        run: |
          if docker inspect naruv-gate5-ci >/dev/null 2>&1; then docker rm -f naruv-gate5-ci; fi
          ! docker inspect naruv-gate5-ci >/dev/null 2>&1
