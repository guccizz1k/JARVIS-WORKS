name: JW V22.3 unified A security and S4 forensic regression
on:
  push:
    branches:
      - review/jw-v223-s4-snapshot-guard-20261114
    paths:
      - app/pg_cinema_cutover_front_v223.py
      - app/pg_cinema_s4_reconciliation_v1.py
      - tests/test_cinema_pg_cutover_merged_header_boundary_v223.py
      - tests/test_cinema_pg_v223_direct_route_header_isolation.py
      - tests/test_cinema_pg_cutover_front_v223.py
      - tests/test_cinema_pg_cutover_logout_v223.py
      - tests/test_cinema_pg_s4_reconciliation.py
      - tests/test_cinema_pg_s4_snapshot_integrity_20261114.py tests/test_cinema_pg_v223_trade_auth_integration_20261114.py
      - tests/test_cinema_pg_v223_trade_auth_integration_20261114.py
      - .github/workflows/jw-v223-a-s4-unified-20261114.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jw-v223-unified-a-s4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrated-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Exact review SHA checkout, no persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Minimal isolated dependencies
        run: |
          python -m pip install --disable-pip-version-check 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'pytest>=8,<10' 'pytest-asyncio>=0.24,<2'
      - name: Compile touched production modules and test files
        run: |
          python -m py_compile app/pg_cinema_cutover_front_v223.py app/pg_cinema_s4_reconciliation_v1.py tests/test_cinema_pg_cutover_merged_header_boundary_v223.py tests/test_cinema_pg_v223_direct_route_header_isolation.py tests/test_cinema_pg_cutover_front_v223.py tests/test_cinema_pg_cutover_logout_v223.py tests/test_cinema_pg_s4_reconciliation.py tests/test_cinema_pg_s4_snapshot_integrity_20261114.py tests/test_cinema_pg_v223_trade_auth_integration_20261114.py
      - name: Execute A header and S4 snapshot regressions on same SHA
        run: |
          python -m pytest -q -ra -p no:cacheprovider --noconftest --junitxml=a-s4-unified.xml tests/test_cinema_pg_cutover_merged_header_boundary_v223.py tests/test_cinema_pg_v223_direct_route_header_isolation.py tests/test_cinema_pg_cutover_front_v223.py tests/test_cinema_pg_cutover_logout_v223.py tests/test_cinema_pg_s4_reconciliation.py tests/test_cinema_pg_s4_snapshot_integrity_20261114.py tests/test_cinema_pg_v223_trade_auth_integration_20261114.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('a-s4-unified.xml').getroot()
          suites=[root] if root.tag=='testsuite' else root.findall('.//testsuite')
          v={k:sum(int(s.get(k,'0')) for s in suites) for k in ('tests','failures','errors','skipped')}
          assert v == {'tests':100,'failures':0,'errors':0,'skipped':0}, v
          print('UNIFIED_A_S4_TRADE_100_OF_100_PASS')
          PY
