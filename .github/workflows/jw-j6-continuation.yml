name: J6 verified engineering contract and real PG17 restore drill
on:
  push:
    branches:
      - review/j6-v90-verified-continuation-20261024
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: jw-j6-verification
  cancel-in-progress: true

jobs:
  j6-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check ancestry and leave application/database untouched
        run: |
          git merge-base --is-ancestor a3783ef9f7aeeeff655f1f0ac376f6d8edf5b338 HEAD
          git merge-base --is-ancestor 550ef6868a0476fafe31e2bf4df02d45e25def1d HEAD
          git diff --exit-code 550ef6868a0476fafe31e2bf4df02d45e25def1d HEAD -- app/ db/ migrations/ security/ requirements.txt requirements-dev.txt
      - name: Test J6 documentation, release evidence gate, restore fail-closed rules
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt
          python -m py_compile scripts/jw_evidence_gate.py scripts/ci_j6_postgres_restore.py
          python -m pytest -q tests/test_jw_evidence_gate.py tests/test_j6_postgres_restore.py -ra --junitxml=j6-contract.xml
          python scripts/jw_evidence_gate.py --check-project .
          python scripts/jw_evidence_gate.py --check docs/agents/V90_AGENT_ADOPTION_EVIDENCE.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-j6-contract-evidence
          path: j6-contract.xml
          retention-days: 3

  j6-postgres-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JW_ENV: review
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-only-ephemeral-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Python/browser tools
        run: |
          python -m pip install -r requirements.txt -r requirements-postgres-check.txt
          npm install -g @playwright/cli@0.1.22
          playwright-cli install
      - name: Reproduce real PG17 messenger activity and commit-order proof
        run: |
          python -m py_compile scripts/ci_v90_postgres_browser.py
          python -m scripts.ci_v90_postgres_browser
      - name: J5/J6 actual custom dump and restored DB integrity comparison
        run: |
          python -m scripts.ci_j6_postgres_restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-j6-pg-browser-evidence
          path: artifacts/playwright-cli/
          retention-days: 3
          if-no-files-found: ignore
