name: JW V9.2 isolated PG quote API and J1-J6 contract
on:
  push:
    branches:
      - review/v92-postgres-quote-write-j1j6-20261025
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jw-v92-isolated-quote
  cancel-in-progress: true
jobs:
  finance-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: J1 preserve original legacy frontend and immutable PG migrations
        run: |
          git merge-base --is-ancestor 27f5c5fbb427c17fff2f702992b8a95f31a479d5 HEAD
          git diff --exit-code 27f5c5fbb427c17fff2f702992b8a95f31a479d5 HEAD -- app/main.py app/static/ migrations/ security/ requirements.txt
          git diff --exit-code 27f5c5fbb427c17fff2f702992b8a95f31a479d5 HEAD -- db/ ':!db/review/ci_v92_quote_ephemeral.sql'
      - name: Existing dev test requirements
        run: python -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt
      - name: J3 J4 staging quote API happy and negative contract
        run: |
          python -m py_compile app/pg_quote_api_v92.py app/pg_dev_entry_v92.py
          python -m pytest -q tests/test_pg_quote_api_v92.py tests/test_pg_connection_gate_v87.py tests/test_pg_gateway_alignment_v91.py -ra --junitxml=jw-v92-quote-contract.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v92-quote-contract
          path: jw-v92-quote-contract.xml
          retention-days: 3
  actual-pg17-quote-transactions:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JW_ENV: review
      JW_PG_CI_ALLOW: ONLY_EPHEMERAL_LOCAL_DATABASE
      JW_PG_CI_ROOT_DSN: postgresql://postgres:ci-only-ephemeral-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install staged API and Psycopg dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-postgres-check.txt
      - name: Real independent PostgreSQL 17 quote API, RLS and crash rollback proof
        run: |
          python -m py_compile scripts/ci_pg_v92_quote_http.py
          python -m scripts.ci_pg_v92_quote_http
