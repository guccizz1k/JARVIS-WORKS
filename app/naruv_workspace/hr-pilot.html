<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body><header><a href="/naruv-workspace">업무 조회</a><span>NARUV ONE / CI ONLY</span></header>
<main><h1>인사 업무 연결 시험</h1><p>격리 시험 전용 · 가상 직원 pilot-ui · 2026년 6월 · 실제 지급 및 법정 검증 불가</p>
<p id="mobile" role="status">PC 화면에서 이용할 수 있습니다.</p>
<section id="desk" aria-label="가상 인사 업무">

<label><span>이 변경은 가상 데이터에만 적용됨을 확인합니다.</span><input id="approve" type="checkbox"></label>
<div class="toolbar"><button id="register">직원 등록</button><button id="create">기간 설정</button><button id="attendance">근태 입력</button><button id="review">근태 검토</button><button id="confirm">검토 확정</button><button id="pay">급여 초안 조회</button><button id="archive">직원 보존</button><button id="clear">화면 지우기</button></div>

</section></main></body></html>
